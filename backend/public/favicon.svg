<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff"/>
      <stop offset="1" stop-color="#ff6584"/>
    </linearGradient>
    <linearGradient id="eye-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6c63ff"/>
    </linearGradient>
    <linearGradient id="eye-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6584"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ff6584" stop-opacity=".3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle ring -->
  <circle cx="256" cy="268" r="210" fill="none" stroke="url(#ring)" stroke-width="2"/>

  <!-- === OWL MASCOT === -->

  <!-- Ear tufts -->
  <path d="M160 155 L185 210 L135 210 Z" fill="url(#g)" opacity=".85"/>
  <path d="M352 155 L377 210 L327 210 Z" fill="url(#g)" opacity=".85"/>

  <!-- Body (egg shape) -->
  <ellipse cx="256" cy="320" rx="120" ry="100" fill="#1e1e2e"/>
  <ellipse cx="256" cy="330" rx="85" ry="65" fill="#2a2a3e"/>

  <!-- Belly pattern (V chevrons for feather texture) -->
  <path d="M235 310 L256 325 L277 310" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" opacity=".35"/>
  <path d="M228 330 L256 348 L284 330" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" opacity=".25"/>
  <path d="M235 350 L256 365 L277 350" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" opacity=".15"/>

  <!-- Head -->
  <ellipse cx="256" cy="230" rx="115" ry="100" fill="#1e1e2e"/>

  <!-- Face disc (lighter inner face) -->
  <ellipse cx="256" cy="240" rx="90" ry="78" fill="#252538"/>

  <!-- Wings -->
  <path d="M136 270 Q110 320 145 390 Q160 350 158 300 Z" fill="#1e1e2e" stroke="url(#g)" stroke-width="1.5" opacity=".7"/>
  <path d="M376 270 Q402 320 367 390 Q352 350 354 300 Z" fill="#1e1e2e" stroke="url(#g)" stroke-width="1.5" opacity=".7"/>

  <!-- Eye sockets (dark circles) -->
  <circle cx="210" cy="235" r="42" fill="#0a0a0f"/>
  <circle cx="302" cy="235" r="42" fill="#0a0a0f"/>

  <!-- Eyes (gradient orbs) -->
  <circle cx="210" cy="235" r="34" fill="url(#eye-l)" filter="url(#glow)"/>
  <circle cx="302" cy="235" r="34" fill="url(#eye-r)" filter="url(#glow)"/>

  <!-- Pupils -->
  <circle cx="218" cy="230" r="14" fill="#0a0a0f"/>
  <circle cx="310" cy="230" r="14" fill="#0a0a0f"/>

  <!-- Eye highlights -->
  <circle cx="224" cy="224" r="6" fill="#fff" opacity=".85"/>
  <circle cx="316" cy="224" r="6" fill="#fff" opacity=".85"/>
  <circle cx="212" cy="238" r="3" fill="#fff" opacity=".4"/>
  <circle cx="304" cy="238" r="3" fill="#fff" opacity=".4"/>

  <!-- Beak -->
  <path d="M248 265 L256 285 L264 265 Z" fill="#ffb347"/>
  <path d="M248 265 L256 275 L264 265 Z" fill="#ffc966"/>

  <!-- Eyebrow accents -->
  <path d="M175 195 Q210 180 245 198" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <path d="M267 198 Q302 180 337 195" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".6"/>

  <!-- Feet -->
  <ellipse cx="230" cy="415" rx="22" ry="8" fill="#ffb347" opacity=".8"/>
  <ellipse cx="282" cy="415" rx="22" ry="8" fill="#ffb347" opacity=".8"/>

  <!-- === GRADUATION CAP === -->
  <path d="M180 165 L256 130 L332 165 L256 195 Z" fill="url(#g)"/>
  <rect x="250" y="130" width="12" height="5" rx="2" fill="url(#g)"/>
  <path d="M215 178 L215 205 Q256 222 297 205 L297 178 L256 195 Z" fill="#1e1e2e" stroke="url(#g)" stroke-width="1.5"/>

  <!-- Tassel -->
  <line x1="332" y1="165" x2="345" y2="200" stroke="#ff6584" stroke-width="3" stroke-linecap="round"/>
  <circle cx="345" cy="204" r="6" fill="#ff6584"/>

  <!-- Sparkle accents -->
  <circle cx="405" cy="120" r="8" fill="#ff6584" opacity=".6"/>
  <path d="M401 120l4-7 4 7-7 3 7 3-4 7-4-7-7-3z" fill="#fff" opacity=".7"/>

  <circle cx="100" cy="390" r="5" fill="#6c63ff" opacity=".5"/>
  <path d="M97 390l3-5 3 5-5 2 5 2-3 5-3-5-5-2z" fill="#fff" opacity=".6"/>

  <circle cx="415" cy="380" r="4" fill="#ff6584" opacity=".3"/>
  <circle cx="95" cy="150" r="3" fill="#6c63ff" opacity=".3"/>
</svg>
