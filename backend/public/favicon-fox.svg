<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff"/>
      <stop offset="1" stop-color="#ff6584"/>
    </linearGradient>
    <linearGradient id="eye-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6c63ff"/>
    </linearGradient>
    <linearGradient id="eye-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6584"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ff6584" stop-opacity=".3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle ring -->
  <circle cx="256" cy="268" r="210" fill="none" stroke="url(#ring)" stroke-width="2"/>

  <!-- === FOX MASCOT (dark/neon style) === -->

  <!-- Ears (outer — dark with gradient stroke) -->
  <path d="M130 120 L170 248 L90 232 Z" fill="#1e1e2e" stroke="url(#g)" stroke-width="2"/>
  <path d="M382 120 L342 248 L422 232 Z" fill="#1e1e2e" stroke="url(#g)" stroke-width="2"/>

  <!-- Ears (inner — gradient fill, low opacity like owl tufts) -->
  <path d="M138 160 L165 238 L112 225 Z" fill="url(#g)" opacity=".25"/>
  <path d="M374 160 L347 238 L400 225 Z" fill="url(#g)" opacity=".25"/>

  <!-- Head -->
  <ellipse cx="256" cy="275" rx="130" ry="120" fill="#1e1e2e"/>

  <!-- Face disc (lighter inner, like owl) -->
  <ellipse cx="256" cy="295" rx="90" ry="82" fill="#252538"/>

  <!-- Forehead marking (gradient accent) -->
  <path d="M205 200 Q256 178 307 200 Q285 225 256 230 Q227 225 205 200 Z" fill="url(#g)" opacity=".12"/>

  <!-- Cheek tufts (dark, like owl wings) -->
  <path d="M130 275 Q108 310 135 350 Q150 322 145 288 Z" fill="#1e1e2e" stroke="url(#g)" stroke-width="1.5" opacity=".7"/>
  <path d="M382 275 Q404 310 377 350 Q362 322 367 288 Z" fill="#1e1e2e" stroke="url(#g)" stroke-width="1.5" opacity=".7"/>

  <!-- Eye sockets (dark circles, like owl) -->
  <circle cx="205" cy="265" r="40" fill="#0a0a0f"/>
  <circle cx="307" cy="265" r="40" fill="#0a0a0f"/>

  <!-- Eyes (gradient orbs with glow, same as owl) -->
  <circle cx="205" cy="265" r="32" fill="url(#eye-l)" filter="url(#glow)"/>
  <circle cx="307" cy="265" r="32" fill="url(#eye-r)" filter="url(#glow)"/>

  <!-- Pupils -->
  <circle cx="213" cy="260" r="14" fill="#0a0a0f"/>
  <circle cx="315" cy="260" r="14" fill="#0a0a0f"/>

  <!-- Eye highlights -->
  <circle cx="219" cy="254" r="6" fill="#fff" opacity=".85"/>
  <circle cx="321" cy="254" r="6" fill="#fff" opacity=".85"/>
  <circle cx="208" cy="268" r="3" fill="#fff" opacity=".4"/>
  <circle cx="310" cy="268" r="3" fill="#fff" opacity=".4"/>

  <!-- Eyebrow accents (gradient arcs, like owl) -->
  <path d="M170 228 Q205 212 240 230" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <path d="M272 230 Q307 212 342 228" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".6"/>

  <!-- Nose -->
  <ellipse cx="256" cy="318" rx="12" ry="9" fill="#ffb347"/>
  <ellipse cx="254" cy="316" rx="5" ry="3" fill="#ffc966" opacity=".6"/>

  <!-- Mouth -->
  <path d="M256 327 Q244 340 235 334" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" opacity=".4"/>
  <path d="M256 327 Q268 340 277 334" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" opacity=".4"/>

  <!-- Whiskers (gradient stroke, subtle) -->
  <line x1="160" y1="300" x2="108" y2="290" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" opacity=".25"/>
  <line x1="160" y1="312" x2="105" y2="318" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" opacity=".25"/>
  <line x1="352" y1="300" x2="404" y2="290" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" opacity=".25"/>
  <line x1="352" y1="312" x2="407" y2="318" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" opacity=".25"/>

  <!-- Body -->
  <ellipse cx="256" cy="400" rx="100" ry="50" fill="#1e1e2e"/>
  <ellipse cx="256" cy="405" rx="65" ry="32" fill="#2a2a3e"/>

  <!-- Belly chevrons (feather/fur texture, like owl) -->
  <path d="M235 388 L256 402 L277 388" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" opacity=".3"/>
  <path d="M240 405 L256 416 L272 405" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" opacity=".2"/>

  <!-- Tail (dark with gradient stroke, like owl wings) -->
  <path d="M345 380 Q425 355 435 290 Q445 350 415 395 Q385 430 345 408 Z" fill="#1e1e2e" stroke="url(#g)" stroke-width="2"/>
  <!-- Tail tip accent -->
  <path d="M410 340 Q435 310 435 290 Q440 340 420 375 Q405 400 390 395 Z" fill="url(#g)" opacity=".15"/>

  <!-- Feet (small warm accent, like owl) -->
  <ellipse cx="220" cy="440" rx="24" ry="10" fill="#ffb347" opacity=".8"/>
  <ellipse cx="292" cy="440" rx="24" ry="10" fill="#ffb347" opacity=".8"/>

  <!-- Sparkle top-right -->
  <circle cx="405" cy="120" r="8" fill="#ff6584" opacity=".6"/>
  <path d="M401 120l4-7 4 7-7 3 7 3-4 7-4-7-7-3z" fill="#fff" opacity=".7"/>

  <!-- Sparkle bottom-left -->
  <circle cx="95" cy="400" r="5" fill="#6c63ff" opacity=".5"/>
  <path d="M92 400l3-5 3 5-5 2 5 2-3 5-3-5-5-2z" fill="#fff" opacity=".6"/>

  <!-- Tiny accent dots -->
  <circle cx="420" cy="400" r="4" fill="#ff6584" opacity=".3"/>
  <circle cx="90" cy="145" r="3" fill="#6c63ff" opacity=".3"/>
</svg>
