<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 확대 허용(I-031): maximum-scale·user-scalable 제한을 두지 않는다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>영단마스터</title>
  <meta name="description" content="단어와 영어 내신 본문을 외우는 학습 앱">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="/favicon-fox.svg">
  <link rel="apple-touch-icon" href="/favicon-fox.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <!-- 테마를 첫 그림 전에 적용해 깜빡임 방지 -->
  <script>try{var t=localStorage.getItem('ydmaster_theme_v2');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div id="app" class="app"><noscript>영단마스터는 자바스크립트가 필요해요.</noscript></div>
</body>
</html>
