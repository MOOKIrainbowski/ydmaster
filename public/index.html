<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 확대 허용(I-031): maximum-scale·user-scalable 제한을 두지 않는다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>영단마스터</title>
  <meta name="description" content="단어와 영어 내신 본문을 외우는 학습 앱">
  <meta name="theme-color" content="#FFF7F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#110A18" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- 영어 장식 글자(헤드라인의 영어 단어만, 02 D7) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <!-- 토큰(원본) → 컴포넌트 → 랜딩 순서(02 D2) -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/landing.css">
  <!-- 테마를 첫 그림 전에 적용해 깜빡임 방지 -->
  <script>try{var t=localStorage.getItem('ydmaster_theme_v2');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div id="app" class="app"><noscript>영단마스터는 자바스크립트가 필요해요.</noscript></div>
</body>
</html>
