<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff"/>
      <stop offset="1" stop-color="#ff6584"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#e8651a"/>
    </linearGradient>
    <linearGradient id="fur-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d45a12"/>
      <stop offset="1" stop-color="#b84a0e"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5ee"/>
      <stop offset="1" stop-color="#ffe8d6"/>
    </linearGradient>
    <linearGradient id="eye-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6c63ff"/>
    </linearGradient>
    <linearGradient id="eye-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6584"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ff6584" stop-opacity=".3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle ring -->
  <circle cx="256" cy="268" r="210" fill="none" stroke="url(#ring)" stroke-width="2.5"/>

  <!-- === FOX MASCOT === -->

  <!-- Ears (outer — orange) -->
  <path d="M128 115 L172 250 L85 232 Z" fill="url(#fur)"/>
  <path d="M384 115 L340 250 L427 232 Z" fill="url(#fur)"/>

  <!-- Ears (inner — pink) -->
  <path d="M138 162 L167 240 L108 226 Z" fill="#ff8aab"/>
  <path d="M374 162 L345 240 L404 226 Z" fill="#ff8aab"/>

  <!-- Tail (behind body) -->
  <path d="M348 378 Q430 350 440 280 Q452 348 420 398 Q388 435 348 410 Z" fill="url(#fur)"/>
  <path d="M408 340 Q438 302 440 280 Q446 338 425 378 Q410 405 395 398 Z" fill="url(#belly)" opacity=".9"/>

  <!-- Body (orange with white belly) -->
  <ellipse cx="256" cy="400" rx="105" ry="52" fill="url(#fur)"/>
  <ellipse cx="256" cy="408" rx="70" ry="36" fill="url(#belly)"/>

  <!-- Head (main orange) -->
  <ellipse cx="256" cy="275" rx="132" ry="122" fill="url(#fur)"/>

  <!-- White face patch -->
  <path d="M180 260 Q200 220 256 210 Q312 220 332 260 Q320 340 256 365 Q192 340 180 260 Z" fill="url(#belly)"/>

  <!-- Forehead darker patch -->
  <path d="M195 195 Q256 168 317 195 Q290 228 256 234 Q222 228 195 195 Z" fill="url(#fur-dark)" opacity=".6"/>

  <!-- Cheek tufts (darker orange) -->
  <path d="M128 272 Q104 312 134 355 Q152 325 146 286 Z" fill="url(#fur-dark)"/>
  <path d="M384 272 Q408 312 378 355 Q360 325 366 286 Z" fill="url(#fur-dark)"/>

  <!-- Eye sockets -->
  <circle cx="205" cy="265" r="42" fill="#0a0a0f"/>
  <circle cx="307" cy="265" r="42" fill="#0a0a0f"/>

  <!-- Eyes (gradient orbs with glow) -->
  <circle cx="205" cy="265" r="35" fill="url(#eye-l)" filter="url(#glow)"/>
  <circle cx="307" cy="265" r="35" fill="url(#eye-r)" filter="url(#glow)"/>

  <!-- Pupils -->
  <circle cx="214" cy="260" r="14" fill="#0a0a0f"/>
  <circle cx="316" cy="260" r="14" fill="#0a0a0f"/>

  <!-- Eye highlights -->
  <circle cx="220" cy="253" r="7" fill="#fff" opacity=".9"/>
  <circle cx="322" cy="253" r="7" fill="#fff" opacity=".9"/>
  <circle cx="208" cy="269" r="3.5" fill="#fff" opacity=".45"/>
  <circle cx="310" cy="269" r="3.5" fill="#fff" opacity=".45"/>

  <!-- Eyebrow accents -->
  <path d="M168 225 Q205 208 243 228" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
  <path d="M269 228 Q307 208 344 225" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>

  <!-- Nose -->
  <ellipse cx="256" cy="320" rx="14" ry="11" fill="#2a2a3e"/>
  <ellipse cx="254" cy="317" rx="6" ry="3.5" fill="#3d3d52" opacity=".7"/>
  <ellipse cx="252" cy="315" rx="3" ry="2" fill="#fff" opacity=".3"/>

  <!-- Mouth -->
  <path d="M256 331 Q243 346 232 338" fill="none" stroke="#c8756a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M256 331 Q269 346 280 338" fill="none" stroke="#c8756a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blush cheeks -->
  <ellipse cx="172" cy="300" rx="20" ry="12" fill="#ff6584" opacity=".25"/>
  <ellipse cx="340" cy="300" rx="20" ry="12" fill="#ff6584" opacity=".25"/>

  <!-- Whiskers -->
  <line x1="158" y1="302" x2="100" y2="290" stroke="#ffcdb2" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
  <line x1="158" y1="316" x2="96" y2="322" stroke="#ffcdb2" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
  <line x1="354" y1="302" x2="412" y2="290" stroke="#ffcdb2" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
  <line x1="354" y1="316" x2="416" y2="322" stroke="#ffcdb2" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>

  <!-- Belly chevron markings -->
  <path d="M233 392 L256 406 L279 392" fill="none" stroke="url(#fur)" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
  <path d="M240 410 L256 420 L272 410" fill="none" stroke="url(#fur)" stroke-width="2" stroke-linecap="round" opacity=".35"/>

  <!-- Feet -->
  <ellipse cx="218" cy="442" rx="26" ry="11" fill="url(#fur-dark)"/>
  <ellipse cx="294" cy="442" rx="26" ry="11" fill="url(#fur-dark)"/>
  <!-- Paw pads -->
  <circle cx="210" cy="442" r="4" fill="#ffb0c0" opacity=".7"/>
  <circle cx="218" cy="440" r="4" fill="#ffb0c0" opacity=".7"/>
  <circle cx="226" cy="442" r="4" fill="#ffb0c0" opacity=".7"/>
  <circle cx="286" cy="442" r="4" fill="#ffb0c0" opacity=".7"/>
  <circle cx="294" cy="440" r="4" fill="#ffb0c0" opacity=".7"/>
  <circle cx="302" cy="442" r="4" fill="#ffb0c0" opacity=".7"/>

  <!-- Sparkle top-right -->
  <circle cx="405" cy="115" r="10" fill="#ff6584" opacity=".7"/>
  <path d="M400 115l5-9 5 9-8 4 8 4-5 9-5-9-8-4z" fill="#fff" opacity=".8"/>

  <!-- Sparkle bottom-left -->
  <circle cx="95" cy="400" r="7" fill="#6c63ff" opacity=".6"/>
  <path d="M91 400l4-7 4 7-6 3 6 3-4 7-4-7-6-3z" fill="#fff" opacity=".7"/>

  <!-- Accent dots -->
  <circle cx="425" cy="405" r="5" fill="#ff6584" opacity=".4"/>
  <circle cx="88" cy="140" r="4" fill="#6c63ff" opacity=".35"/>
</svg>
