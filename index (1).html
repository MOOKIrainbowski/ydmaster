      <div style="background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accent-rgb),.2);border-radius:12px;padding:14px 16px;margin-top:4px">
        <div style="font-size:.8rem;color:var(--accent);font-weight:600;margin-bottom:5px">${ic('bulb',14)} 방식 안내</div>
        <div style="font-size:.78rem;color:var(--text2);line-height:1.6"><b>셀 방식:</b> A열에 단어, B열에 정답을 입력하면 보기를 자동 구성합니다.<br><b>주관식/서술형:</b> 문제와 정답 키워드를 입력하면 키워드 기반으로 자동 채점합니다. 테스트 전체에 시간 제한을 설정할 수 있습니다.</div>
      </div>
    </div>
  </div>`;
    }

    function chooseFormat(fmt) {
      S.editorFormat = fmt; S.editorTest.format = fmt;
      buildEditor(document.getElementById('app'));
    }

    /* ============================================================
       ESSAY EDITOR
    ============================================================ */
    function buildEssayEditor(app) {
      const t = S.editorTest;
      if (!t.questions.length) t.questions.push({ question: '', answer: '', keywords: [], answerContext: '', options: [] });
      app.innerHTML = `
  <div class="page active" style="flex-direction:column;height:100dvh;overflow:hidden">
    <div class="editor-topbar">
      <button class="nav-btn ghost" style="padding:7px 12px;font-size:.8rem" onclick="cancelEditor()">← 취소</button>
      <h2>${S.editing ? '테스트 수정' : '주관식/서술형'} ${ic('pencilDoc',18)}</h2>
      <button class="nav-btn primary" style="padding:7px 14px;font-size:.8rem" onclick="saveTest()">저장</button>
    </div>
    <div class="editor-scroll" id="ed-scroll">
      <div class="editor-meta">
        <div class="editor-meta-title">기본 정보</div>
        <div class="form-group"><label class="form-label">테스트 제목 *</label><input type="text" class="form-input" id="et-title" value="${esc(t.title)}" placeholder="예: 영어 서술형 평가"/></div>
        <div class="form-group"><label class="form-label">설명</label><input type="text" class="form-input" id="et-desc" value="${esc(t.description)}" placeholder="간단한 설명을 입력하세요"/></div>
        <div class="form-group"><label class="form-label">⏱ 시험 시간 제한 (분, 0=무제한)</label><input type="number" class="form-input" id="et-timelimit" value="${Math.floor((t.testTimeLimit || 0) / 60)}" min="0" max="180" placeholder="0"/></div>
        <div class="toggle-wrap">
          <span class="toggle-label">${ic('globe',14)} 전체 공개</span>
          <div class="toggle ${t.isPublic && !t.isFriendOnly ? 'on' : ''}" id="pub-tog" onclick="togglePub()"></div>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-label">${ic('people',14)} 친구만 공개</span>
          <div class="toggle ${t.isFriendOnly ? 'on' : ''}" id="fri-tog" onclick="toggleFriend()"></div>
        </div>
      </div>
      <div class="editor-meta-title" style="margin:16px 0 8px">문항 (${t.questions.length})</div>
      <div id="essay-questions">
        ${t.questions.map((q, i) => `
        <div class="q-card" data-qi="${i}">
          <div class="q-header">
            <span class="q-num">Q${i + 1}</span>
            ${t.questions.length > 1 ? `<button class="q-del" onclick="delEssayQ(${i})">✕</button>` : ''}
          </div>
          <div class="form-group"><label class="form-label">문제 *</label><textarea class="form-input essay-q" rows="2" placeholder="문제를 입력하세요" data-qi="${i}">${esc(q.question)}</textarea></div>
          <div class="form-group"><label class="form-label">정답 (참고용)</label><input type="text" class="form-input essay-a" value="${esc(q.answer)}" placeholder="정답 또는 모범 답안" data-qi="${i}"/></div>
          <div class="form-group"><label class="form-label">채점 키워드 <small style="color:var(--text3)">(쉼표로 구분)</small></label><input type="text" class="form-input essay-kw" value="${(q.keywords || []).join(', ')}" placeholder="키워드1, 키워드2, ..." data-qi="${i}"/></div>
          <div class="form-group"><label class="form-label">채점 맥락/기준 <small style="color:var(--text3)">(선택)</small></label><input type="text" class="form-input essay-ctx" value="${esc(q.answerContext || '')}" placeholder="이 문제의 채점 기준을 설명하세요" data-qi="${i}"/></div>
        </div>`).join('')}
      </div>
      <button class="btn ghost full" style="margin-top:8px" onclick="addEssayQ()">+ 문항 추가하기</button>
    </div>
  </div>`;
    }
    function syncEssayQuestions() {
      const t = S.editorTest;
      document.querySelectorAll('.essay-q').forEach(el => {
        const i = +el.dataset.qi; if (t.questions[i]) t.questions[i].question = el.value;
      });
      document.querySelectorAll('.essay-a').forEach(el => {
        const i = +el.dataset.qi; if (t.questions[i]) t.questions[i].answer = el.value;
      });
      document.querySelectorAll('.essay-kw').forEach(el => {
        const i = +el.dataset.qi; if (t.questions[i]) t.questions[i].keywords = el.value.split(',').map(s => s.trim()).filter(Boolean);
      });
      document.querySelectorAll('.essay-ctx').forEach(el => {
        const i = +el.dataset.qi; if (t.questions[i]) t.questions[i].answerContext = el.value;
      });
    }
    function addEssayQ() {
      syncEssayQuestions();
      S.editorTest.questions.push({ question: '', answer: '', keywords: [], answerContext: '', options: [] });
      buildEssayEditor(document.getElementById('app'));
      setTimeout(() => { const s = document.getElementById('ed-scroll'); if (s) s.scrollTop = s.scrollHeight; }, 50);
    }
    function delEssayQ(i) {
      syncEssayQuestions();
      S.editorTest.questions.splice(i, 1);
      buildEssayEditor(document.getElementById('app'));
    }

    /* ============================================================
       EDITOR
    ============================================================ */
    function buildEditor(app) {
      const t = S.editorTest;
      if (t.format === 'essay') { buildEssayEditor(app); return; }
      const isSec = t.format === 'section';
      app.innerHTML = `
  <div class="page active" style="flex-direction:column;height:100dvh;overflow:hidden">
    <div class="editor-topbar">
      <button class="nav-btn ghost" style="padding:7px 12px;font-size:.8rem" onclick="cancelEditor()">← 취소</button>
      <h2>${S.editing ? '테스트 수정' : (isSec ? '섹션 방식' : '셀 방식')} ${isSec ? ic('clipboard',18) : ic('bolt',18)}</h2>
      <button class="nav-btn primary" style="padding:7px 14px;font-size:.8rem" onclick="saveTest()">저장</button>
    </div>
    <div class="editor-scroll" id="ed-scroll">
      <div class="editor-meta">
        <div class="editor-meta-title">기본 정보</div>
        <div class="form-group"><label class="form-label">테스트 제목 *</label><input type="text" class="form-input" id="et-title" value="${esc(t.title)}" placeholder="예: 수능 필수 영단어 50"/></div>
        <div class="form-group"><label class="form-label">설명</label><input type="text" class="form-input" id="et-desc" value="${esc(t.description)}" placeholder="간단한 설명을 입력하세요"/></div>
        <div class="toggle-wrap">
          <span class="toggle-label">${ic('globe',14)} 전체 공개</span>
          <div class="toggle ${t.isPublic && !t.isFriendOnly ? 'on' : ''}" id="pub-tog" onclick="togglePub()"></div>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-label">${ic('people',14)} 친구에게만 공개</span>
          <div class="toggle ${t.isFriendOnly ? 'on' : ''}" id="friend-tog" onclick="toggleFriendOnly()"></div>
        </div>
      </div>
      ${isSec ? buildSectionEditor(t) : buildCellEditor(t)}
    </div>
    <div class="save-bar">
      <button class="btn ghost" onclick="cancelEditor()">취소</button>
      <button class="btn primary" onclick="saveTest()">💾 저장하기</button>
    </div>
  </div>`;
    }

    function buildSectionEditor(t) {
      return `<div class="q-list" id="q-list">${t.questions.map((q, i) => qCard(q, i)).join('')}</div>
  <button class="add-q-btn" onclick="addQ()">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
    문항 추가하기
  </button>`;
    }

    function qCard(q, idx) {
      return `<div class="q-card" id="qc-${idx}">
    <div class="q-card-hdr">
      <span class="q-num">Q${idx + 1}</span>
      <div class="q-card-acts">
        <select class="q-type-sel" id="qt-${idx}" onchange="updateQType(${idx})">
          <option value="en-to-ko" ${q.questionType === 'en-to-ko' ? 'selected' : ''}>영어→한글</option>
          <option value="ko-to-en" ${q.questionType === 'ko-to-en' ? 'selected' : ''}>한글→영어</option>
        </select>
        <button class="q-del-btn" onclick="removeQ(${idx})">
          <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">${q.questionType === 'ko-to-en' ? '한글 뜻 (문제)' : '영단어 (문제)'}</label>
      <input type="text" class="form-input" id="qt-txt-${idx}" value="${esc(q.question)}" placeholder="${q.questionType === 'ko-to-en' ? '예: 사과' : '예: apple'}" oninput="updateQText(${idx})"/>
    </div>
    <div style="margin-top:12px">
      <label class="form-label">보기 <small style="color:var(--text3);font-size:.7rem">(동그라미 = 정답)</small></label>
      <div class="opts-list" id="opts-${idx}">
        ${(q.options || []).map((o, oi) => optRow(idx, oi, o, q.correctAnswer === oi)).join('')}
      </div>
      <button class="add-opt-btn" onclick="addOpt(${idx})" ${(q.options || []).length >= 6 ? 'disabled style="opacity:.4"' : ''}>+ 보기 추가</button>
    </div>
    <div class="timer-row">
      <span class="timer-label">
        <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        문항 타이머
      </span>
      <input type="number" class="timer-input" id="qtimer-${idx}" value="${q.timeLimit || 0}" min="0" max="300" placeholder="0" oninput="updateQTimer(${idx})"/>
      <span class="timer-unit">초 (0=제한없음)</span>
    </div>
  </div>`;
    }

    function optRow(qi, oi, val, isCorrect) {
      return `<div class="opt-row" id="or-${qi}-${oi}">
    <div class="opt-radio ${isCorrect ? 'correct' : ''}" onclick="setCorrect(${qi},${oi})"></div>
    <input type="text" class="opt-input" value="${esc(val)}" placeholder="보기 ${oi + 1}" oninput="updateOpt(${qi},${oi},this.value)"/>
    <button class="opt-del" onclick="removeOpt(${qi},${oi})">
      <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>`;
    }

    /* ══════════════════════════════════════
       셀 방식 — 스프레드시트 에디터 JS
    ══════════════════════════════════════ */
    let _ssSelectedRows = new Set(); // 선택된 행 인덱스

    function buildCellEditor(t) {
      if (!t.questions.length) t.questions.push({ question: '', answer: '', timeLimit: 0 });
      return `
  <div class="ss-bottom-bar">
    ⚡ <b>셀 방식:</b> A열(문제/단어) + B열(정답) 입력 · Tab/Enter 이동 · 행 번호 드래그로 다중 선택 · Ctrl+C/V로 복사·붙여넣기 · .xlsx/.csv 파일 가져오기 지원
  </div>
  <div class="ss-outer" id="ss-outer">
    <div class="ss-toolbar">
      <button class="ss-toolbar-btn" onclick="ssAddRowBelow()" title="행 추가 (마지막)">
        <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>행 추가
      </button>
      <button class="ss-toolbar-btn" onclick="ssInsertRowAbove()" title="선택 행 위에 삽입">↑ 위에 삽입</button>
      <button class="ss-toolbar-btn" onclick="ssInsertRowBelow()" title="선택 행 아래에 삽입">↓ 아래에 삽입</button>
      <div class="ss-toolbar-sep"></div>
      <button class="ss-toolbar-btn" onclick="ssDuplicateRows()" title="선택 행 복제">⧉ 복제</button>
      <button class="ss-toolbar-btn" onclick="ssClearSelected()" title="선택 행 내용 지우기">✕ 내용 지우기</button>
      <button class="ss-toolbar-btn danger" onclick="ssDeleteSelected()" title="선택 행 삭제">${ic('trash',13)} 삭제</button>
      <div class="ss-toolbar-sep"></div>
      <button class="ss-toolbar-btn" onclick="ssSortRows()" title="A열 기준 정렬">↕ 정렬</button>
      <div class="ss-toolbar-sep"></div>
      <label class="ss-toolbar-btn" title="엑셀/CSV 파일 가져오기" style="cursor:pointer">
        <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        파일 가져오기
        <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="ssHandleFileUpload(event)">
      </label>
      <span class="ss-row-count" id="ss-row-count">${t.questions.length}행</span>
    </div>
    <div class="ss-scroll" id="ss-scroll">
      <table class="ss-table" id="ss-table">
        <thead>
          <tr>
            <th class="ss-th-corner"></th>
            <th class="ss-th col-q">A — 문제 (단어/뜻)</th>
            <th class="ss-th col-a">B — 정답</th>
            <th class="ss-th col-t">⏱ 타이머(초)</th>
            <th class="ss-th col-x"></th>
          </tr>
        </thead>
        <tbody id="ss-tbody">
          ${t.questions.map((q, i) => ssRow(q, i)).join('')}
        </tbody>
      </table>
    </div>
    <button class="ss-add-row" onclick="ssAddRowBelow()">
      <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
      행 추가
    </button>
  </div>`;
    }

    function ssRow(q, idx) {
      const sel = _ssSelectedRows.has(idx);
      return `<tr class="ss-row${sel ? ' selected' : ''}" id="ss-row-${idx}" onclick="ssToggleRow(event,${idx})" onmouseover="ssDragRowOver(event,${idx})">
    <td class="ss-row-num" onmousedown="ssDragRowStart(event,${idx})" style="cursor:row-resize;user-select:none">${idx + 1}</td>
    <td class="ss-cell q-col" id="ss-cell-q-${idx}">
      <input type="text" id="ss-q-${idx}" value="${esc(q.question || '')}"
        placeholder="단어 또는 뜻 입력..."
        oninput="ssUpdateCell(${idx},'question',this.value)"
        onkeydown="ssKeyNav(event,${idx},'q')"
        onfocus="ssFocusCell(${idx},'q')"
        onblur="ssBlurCell(${idx},'q')"
        onpaste="ssPasteHandler(event,${idx},'q')"/>
    </td>
    <td class="ss-cell ans-col" id="ss-cell-a-${idx}">
      <input type="text" id="ss-a-${idx}" value="${esc(q.answer || '')}"
        placeholder="정답 입력..."
        oninput="ssUpdateCell(${idx},'answer',this.value)"
        onkeydown="ssKeyNav(event,${idx},'a')"
        onfocus="ssFocusCell(${idx},'a')"
        onblur="ssBlurCell(${idx},'a')"
        onpaste="ssPasteHandler(event,${idx},'a')"/>
    </td>
    <td class="ss-cell timer-col" id="ss-cell-t-${idx}">
      <input type="number" id="ss-t-${idx}" value="${q.timeLimit || 0}"
        min="0" max="300" placeholder="0"
        oninput="ssUpdateCell(${idx},'timeLimit',parseInt(this.value)||0)"
        onkeydown="ssKeyNav(event,${idx},'t')"/>
    </td>
    <td class="ss-cell-del">
      <button class="ss-del-btn" onclick="ssDeleteRow(event,${idx})" title="행 삭제">
        <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </td>
  </tr>`;
    }

    function ssRefreshTable() {
      const tbody = document.getElementById('ss-tbody');
      if (!tbody) return;
      tbody.innerHTML = S.editorTest.questions.map((q, i) => ssRow(q, i)).join('');
      const cnt = document.getElementById('ss-row-count');
      if (cnt) cnt.textContent = S.editorTest.questions.length + '행';
    }

    function ssUpdateCell(idx, field, val) {
      if (S.editorTest.questions[idx]) S.editorTest.questions[idx][field] = val;
    }

    function ssFocusCell(idx, col) {
      document.getElementById(`ss-cell-${col === 'a' ? 'a' : col === 't' ? 't' : 'q'}-${idx}`)?.classList.add('focused');
    }
    function ssBlurCell(idx, col) {
      document.getElementById(`ss-cell-${col === 'a' ? 'a' : col === 't' ? 't' : 'q'}-${idx}`)?.classList.remove('focused');
    }

    // 키보드 내비게이션: Tab/Shift+Tab, Enter/Shift+Enter, Arrow keys
    function ssKeyNav(e, idx, col) {
      const total = S.editorTest.questions.length;
      const cols = ['q', 'a', 't'];
      const ci = cols.indexOf(col);

      if (e.key === 'Tab') {
        e.preventDefault();
        if (!e.shiftKey) {
          // 다음 셀
          if (ci < cols.length - 1) { document.getElementById(`ss-${cols[ci + 1]}-${idx}`)?.focus(); }
          else {
            // 마지막 열 → 다음 행 첫 열
            if (idx + 1 < total) { document.getElementById(`ss-q-${idx + 1}`)?.focus(); }
            else { ssAddRowBelow(); setTimeout(() => document.getElementById(`ss-q-${total}`)?.focus(), 30); }
          }
        } else {
          // 이전 셀
          if (ci > 0) { document.getElementById(`ss-${cols[ci - 1]}-${idx}`)?.focus(); }
          else if (idx > 0) { document.getElementById(`ss-t-${idx - 1}`)?.focus(); }
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (!e.shiftKey) {
          if (idx + 1 < total) { document.getElementById(`ss-${col}-${idx + 1}`)?.focus(); }
          else if (col === 'a' || col === 'q') { ssAddRowBelow(); setTimeout(() => document.getElementById(`ss-q-${total}`)?.focus(), 30); }
        } else {
          if (idx > 0) document.getElementById(`ss-${col}-${idx - 1}`)?.focus();
        }
      } else if (e.key === 'ArrowDown' && e.ctrlKey) {
        e.preventDefault();
        if (idx + 1 < total) document.getElementById(`ss-${col}-${idx + 1}`)?.focus();
      } else if (e.key === 'ArrowUp' && e.ctrlKey) {
        e.preventDefault();
        if (idx > 0) document.getElementById(`ss-${col}-${idx - 1}`)?.focus();
      } else if (e.key === 'Delete' && e.ctrlKey) {
        e.preventDefault(); ssDeleteRow(null, idx);
      }
    }

    // 붙여넣기 핸들러 (엑셀/스프레드시트 형식: 탭/줄바꿈 구분)
    function ssPasteHandler(e, startIdx, startCol) {
      const text = (e.clipboardData || window.clipboardData).getData('text');
      if (!text.includes('\t') && !text.includes('\n')) return; // 단순 텍스트는 기본 붙여넣기
      e.preventDefault();

      const lines = text.trim().split(/\r?\n/);
      const cols = ['q', 'a', 't'];
      const startColIdx = cols.indexOf(startCol);
      let inserted = 0;

      lines.forEach((line, li) => {
        const cells = line.split('\t');
        const rowIdx = startIdx + li;
        // 행이 부족하면 추가
        while (S.editorTest.questions.length <= rowIdx) {
          S.editorTest.questions.push({ question: '', answer: '', timeLimit: 0 });
        }
        cells.forEach((cell, ci) => {
          const colIdx = startColIdx + ci;
          if (colIdx === 0) S.editorTest.questions[rowIdx].question = cell.trim();
          else if (colIdx === 1) S.editorTest.questions[rowIdx].answer = cell.trim();
          else if (colIdx === 2) S.editorTest.questions[rowIdx].timeLimit = parseInt(cell.trim()) || 0;
        });
        inserted++;
      });

      ssRefreshTable();
      toast(`📋 ${inserted}행을 붙여넣었습니다`, 'success');
      // 붙여넣기 후 포커스 복원
      setTimeout(() => document.getElementById(`ss-${startCol}-${startIdx}`)?.focus(), 40);
    }

    // ── 파일 가져오기 (.xlsx / .xls / .csv) ──
    function ssHandleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      e.target.value = '';
      const ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'csv') {
        const reader = new FileReader();
        reader.onload = ev => ssParseCSV(ev.target.result);
        reader.readAsText(file, 'utf-8');
      } else if (ext === 'xlsx' || ext === 'xls') {
        if (typeof XLSX === 'undefined') { toast('엑셀 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요.', 'error'); return; }
        const reader = new FileReader();
        reader.onload = ev => ssParseExcel(ev.target.result);
        reader.readAsArrayBuffer(file);
      } else {
        toast('.xlsx, .xls, .csv 파일만 지원합니다.', 'error');
      }
    }

    function ssParseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      if (!lines.length) { toast('파일에 데이터가 없습니다.', 'error'); return; }
      const rows = [];
      for (let i = 0; i < lines.length; i++) {
        // 쉼표 분리 (간단한 CSV 파서)
        const cols = lines[i].split(',');
        if (cols.length > 2 && cols.slice(2).some(c => c.trim())) {
          toast(`${i + 1}행: A열(문제)과 B열(정답) 외 다른 열에 데이터가 있습니다. A·B열만 사용해주세요.`, 'error');
          return;
        }
        const question = (cols[0] || '').replace(/^"|"$/g, '').trim();
        const answer = (cols[1] || '').replace(/^"|"$/g, '').trim();
        if (!question && !answer) continue;
        rows.push({ question, answer, timeLimit: 0 });
      }
      if (!rows.length) { toast('유효한 데이터가 없습니다.', 'error'); return; }
      S.editorTest.questions = rows;
      ssRefreshTable();
      toast(`✅ ${rows.length}행을 가져왔습니다.`, 'success');
    }

    function ssParseExcel(buffer) {
      try {
        const wb = XLSX.read(new Uint8Array(buffer), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        if (!data.length) { toast('파일에 데이터가 없습니다.', 'error'); return; }
        const rows = [];
        for (let i = 0; i < data.length; i++) {
          const row = data[i];
          if (!row || !row.length) continue;
          // C열 이상에 데이터 있으면 에러
          if (row.length > 2 && row.slice(2).some(c => String(c || '').trim())) {
            toast(`${i + 1}행: A열(문제)과 B열(정답) 외 다른 열에 데이터가 있습니다. A·B열만 사용해주세요.`, 'error');
            return;
          }
          const question = String(row[0] || '').trim();
          const answer = String(row[1] || '').trim();
          if (!question && !answer) continue;
          rows.push({ question, answer, timeLimit: 0 });
        }
        if (!rows.length) { toast('유효한 데이터가 없습니다.', 'error'); return; }
        S.editorTest.questions = rows;
        ssRefreshTable();
        toast(`✅ ${rows.length}행을 가져왔습니다.`, 'success');
      } catch (err) {
        toast('파일을 읽는 중 오류가 발생했습니다: ' + err.message, 'error');
      }
    }

    // ── 셀 드래그 선택 ──
    let _ssDragStart = -1;
    let _ssDragging = false;

    function ssDragRowStart(e, idx) {
      if (e.button !== 0) return;
      e.preventDefault();
      _ssDragStart = idx;
      _ssDragging = true;
      if (!e.ctrlKey && !e.metaKey) _ssSelectedRows.clear();
      _ssSelectedRows.add(idx);
      _ssLastSelected = idx;
      ssUpdateRowHighlight();
    }

    function ssDragRowOver(e, idx) {
      if (!_ssDragging) return;
      e.preventDefault();
      const a = Math.min(_ssDragStart, idx);
      const b = Math.max(_ssDragStart, idx);
      if (!e.ctrlKey && !e.metaKey) _ssSelectedRows.clear();
      for (let i = a; i <= b; i++) _ssSelectedRows.add(i);
      _ssLastSelected = idx;
      ssUpdateRowHighlight();
    }

    function ssUpdateRowHighlight() {
      document.querySelectorAll('.ss-row').forEach((row, i) => {
        const sel = _ssSelectedRows.has(i);
        row.classList.toggle('selected', sel);
        const num = row.querySelector('.ss-row-num');
        if (num) num.style.background = sel ? 'rgba(var(--accent-rgb),.22)' : '';
      });
    }

    document.addEventListener('mouseup', () => { _ssDragging = false; });

    // 선택 셀 복사 (Ctrl+C)
    document.addEventListener('keydown', function (e) {
      if (!((e.ctrlKey || e.metaKey) && e.key === 'c')) return;
      if (!document.getElementById('ss-outer') || _ssSelectedRows.size === 0) return;
      const rows = [..._ssSelectedRows].sort((a, b) => a - b);
      const text = rows.map(i => {
        const q = S.editorTest.questions[i];
        return `${q.question || ''}\t${q.answer || ''}`;
      }).join('\n');
      navigator.clipboard.writeText(text)
        .then(() => toast(`📋 ${rows.length}행 복사됨`, 'success'))
        .catch(() => {
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy'); ta.remove();
          toast(`📋 ${rows.length}행 복사됨`, 'success');
        });
      e.preventDefault();
    });

    // 행 선택 (Ctrl: 다중, Shift: 범위)
    let _ssLastSelected = -1;
    function ssToggleRow(e, idx) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'path' || e.target.tagName === 'svg') return;
      if (e.ctrlKey || e.metaKey) {
        _ssSelectedRows.has(idx) ? _ssSelectedRows.delete(idx) : _ssSelectedRows.add(idx);
      } else if (e.shiftKey && _ssLastSelected >= 0) {
        const [a, b] = [Math.min(_ssLastSelected, idx), Math.max(_ssLastSelected, idx)];
        for (let i = a; i <= b; i++) _ssSelectedRows.add(i);
      } else {
        _ssSelectedRows.clear();
        _ssSelectedRows.add(idx);
      }
      _ssLastSelected = idx;
      // UI 갱신
      document.querySelectorAll('.ss-row').forEach((row, i) => {
        row.classList.toggle('selected', _ssSelectedRows.has(i));
        const num = row.querySelector('.ss-row-num');
        if (num) num.style.background = _ssSelectedRows.has(i) ? 'rgba(var(--accent-rgb),.2)' : '';
      });
    }

    function ssDeleteRow(e, idx) {
      if (e) e.stopPropagation();
      if (S.editorTest.questions.length <= 1) { toast('최소 1행은 필요합니다.', 'error'); return; }
      S.editorTest.questions.splice(idx, 1);
      _ssSelectedRows.clear();
      ssRefreshTable();
    }

    function ssAddRowBelow() {
      S.editorTest.questions.push({ question: '', answer: '', timeLimit: 0 });
      ssRefreshTable();
      const newIdx = S.editorTest.questions.length - 1;
      setTimeout(() => {
        const inp = document.getElementById(`ss-q-${newIdx}`);
        inp?.focus();
        inp?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 30);
    }

    function ssInsertRowAbove() {
      const sel = _ssSelectedRows.size > 0 ? Math.min(..._ssSelectedRows) : S.editorTest.questions.length - 1;
      S.editorTest.questions.splice(sel, 0, { question: '', answer: '', timeLimit: 0 });
      _ssSelectedRows.clear();
      ssRefreshTable();
      setTimeout(() => document.getElementById(`ss-q-${sel}`)?.focus(), 30);
    }

    function ssInsertRowBelow() {
      const sel = _ssSelectedRows.size > 0 ? Math.max(..._ssSelectedRows) : S.editorTest.questions.length - 1;
      S.editorTest.questions.splice(sel + 1, 0, { question: '', answer: '', timeLimit: 0 });
      _ssSelectedRows.clear();
      ssRefreshTable();
      setTimeout(() => document.getElementById(`ss-q-${sel + 1}`)?.focus(), 30);
    }

    function ssDuplicateRows() {
      const idxs = _ssSelectedRows.size > 0 ? [..._ssSelectedRows].sort((a, b) => a - b) : [];
      if (!idxs.length) { toast('복제할 행을 선택하세요.', 'info'); return; }
      const copies = idxs.map(i => ({ ...S.editorTest.questions[i] }));
      const insertAt = Math.max(...idxs) + 1;
      S.editorTest.questions.splice(insertAt, 0, ...copies);
      _ssSelectedRows.clear();
      ssRefreshTable();
      toast(`${copies.length}행을 복제했습니다`, 'success');
    }

    function ssClearSelected() {
      const idxs = _ssSelectedRows.size > 0 ? [..._ssSelectedRows] : [];
      if (!idxs.length) { toast('내용을 지울 행을 선택하세요.', 'info'); return; }
      idxs.forEach(i => {
        if (S.editorTest.questions[i]) {
          S.editorTest.questions[i].question = '';
          S.editorTest.questions[i].answer = '';
          S.editorTest.questions[i].timeLimit = 0;
        }
      });
      _ssSelectedRows.clear();
      ssRefreshTable();
      toast(`${idxs.length}행의 내용을 지웠습니다`, 'info');
    }

    function ssDeleteSelected() {
      const idxs = [..._ssSelectedRows].sort((a, b) => b - a);
      if (!idxs.length) { toast('삭제할 행을 선택하세요.', 'info'); return; }
      if (S.editorTest.questions.length - idxs.length < 1) { toast('최소 1행은 남아야 합니다.', 'error'); return; }
      idxs.forEach(i => S.editorTest.questions.splice(i, 1));
      _ssSelectedRows.clear();
      ssRefreshTable();
      toast(`${idxs.length}행을 삭제했습니다`, 'info');
    }

    function ssSortRows() {
      S.editorTest.questions.sort((a, b) => (a.question || '').localeCompare(b.question || '', 'ko'));
      _ssSelectedRows.clear();
      ssRefreshTable();
      toast('A열 기준으로 정렬했습니다 ↕', 'info');
    }

    /* 기존 addCellRow / removeCellRow / updateCell — ss 방식으로 리다이렉트 */
    function addCellRow() { ssAddRowBelow(); }

    function togglePub() { if (S.editorTest.isFriendOnly) { toast('친구 공개를 먼저 해제하세요.', 'error'); return; } S.editorTest.isPublic = !S.editorTest.isPublic; document.getElementById('pub-tog').className = 'toggle' + (S.editorTest.isPublic ? ' on' : ''); }

    function addQ() { S.editorTest.questions.push({ question: '', answer: '', options: ['', '', '', ''], correctAnswer: 0, questionType: 'en-to-ko', timeLimit: 0 }); refreshQList(); scrollEditorBottom(); }
    function removeQ(idx) { S.editorTest.questions.splice(idx, 1); refreshQList(); }

    function removeOpt(qi, oi) { const q = S.editorTest.questions[qi]; if (q.options.length <= 2) { toast('보기는 최소 2개 이상 필요합니다.', 'error'); return; } q.options.splice(oi, 1); if (q.correctAnswer >= q.options.length) q.correctAnswer = 0; refreshQList(); }
    function updateOpt(qi, oi, val) { S.editorTest.questions[qi].options[oi] = val; }
    function setCorrect(qi, oi) { const q = S.editorTest.questions[qi]; q.options = q.options.map((_, i) => document.getElementById(`or-${qi}-${i}`)?.querySelector('input')?.value ?? _); q.correctAnswer = oi; refreshQList(); }
    function refreshQList() { const el = document.getElementById('q-list'); if (el) el.innerHTML = S.editorTest.questions.map((q, i) => qCard(q, i)).join(''); }

    /* ── 언어 감지 유틸 ── */
    function isKorean(str) { return /[가-힣]/.test(str || ''); }
    function isEnglish(str) { return /[a-zA-Z]/.test(str || ''); }

    // 섹션 방식: 정답 제외 보기가 올바른 언어인지 검증
    function validateOptionLanguages(q, qIdx) {
      const correctOpt = q.options[q.correctAnswer] || '';
      // 문제가 영어 → 정답은 한글 → 오답 보기도 한글이어야 함
      // 문제가 한글 → 정답은 영어 → 오답 보기도 영어여야 함
      const questionIsEn = isEnglish(q.question) && !isKorean(q.question);
      const wrongLang = questionIsEn ? '한글' : '영어';

      for (let oi = 0; oi < q.options.length; oi++) {
        if (oi === q.correctAnswer) continue;
        const opt = q.options[oi];
        if (questionIsEn) {
          // en-to-ko: 오답은 한글이어야 함
          if (!isKorean(opt)) {
            toast(`${qIdx + 1}번 문항의 ${oi + 1}번 오답 보기를 ${wrongLang}으로 입력해주세요.`, 'error');
            return false;
          }
        } else {
          // ko-to-en: 오답은 영어여야 함
          if (!isEnglish(opt)) {
            toast(`${qIdx + 1}번 문항의 ${oi + 1}번 오답 보기를 ${wrongLang}로 입력해주세요.`, 'error');
            return false;
          }
        }
      }
      return true;
    }

    async function saveTest() {
      const t = S.editorTest;
      t.title = document.getElementById('et-title')?.value?.trim() || '';
      t.description = document.getElementById('et-desc')?.value?.trim() || '';
      if (t.format === 'essay') {
        syncEssayQuestions();
        const tlMin = parseInt(document.getElementById('et-timelimit')?.value) || 0;
        t.testTimeLimit = tlMin * 60;
        t.questions = t.questions.filter(q => q.question.trim());
      } else if (t.format === 'section') {
        t.questions.forEach((q, qi) => {
          q.question = document.getElementById(`qt-txt-${qi}`)?.value?.trim() || q.question;
          q.options = q.options.map((_, oi) => document.getElementById(`or-${qi}-${oi}`)?.querySelector('input')?.value ?? _);
          q.timeLimit = parseInt(document.getElementById(`qtimer-${qi}`)?.value) || 0;
          q.answer = q.options[q.correctAnswer] || '';
        });
      } else {
        t.questions.forEach((q, i) => {
          q.question = (document.getElementById(`ss-q-${i}`)?.value ?? q.question).trim();
          q.answer = (document.getElementById(`ss-a-${i}`)?.value ?? q.answer).trim();
          q.timeLimit = parseInt(document.getElementById(`ss-t-${i}`)?.value) || 0;
        });
        t.questions = t.questions.filter(q => q.question || q.answer);
      }
      if (!t.title) { toast('테스트 제목을 입력해주세요.', 'error'); return; }
      if (t.questions.length === 0) { toast('문항을 1개 이상 추가해주세요.', 'error'); return; }
      if (t.format === 'essay') {
        for (const [i, q] of t.questions.entries()) {
          if (!q.question.trim()) { toast(`${i + 1}번 문항의 문제를 입력해주세요.`, 'error'); return; }
          if (!q.keywords?.length && !q.answer?.trim()) { toast(`${i + 1}번 문항의 키워드 또는 정답을 입력해주세요.`, 'error'); return; }
        }
      } else if (t.format === 'section') {
        for (const [i, q] of t.questions.entries()) {
          if (!q.question.trim()) { toast(`${i + 1}번 문항의 단어를 입력해주세요.`, 'error'); return; }
          if (q.options.some(o => !o.trim())) { toast(`${i + 1}번 문항의 모든 보기를 입력해주세요.`, 'error'); return; }
          if (!validateOptionLanguages(q, i)) return;
        }
      } else {
        for (const [i, q] of t.questions.entries()) {
          if (!q.question.trim() || !q.answer.trim()) { toast(`${i + 1}번 행의 A열과 B열을 모두 입력해주세요.`, 'error'); return; }
        }
      }
      try {
        if (S.editing) { await apiFetch('PUT', `/tests/${S.editing}`, t); toast('테스트가 수정되었습니다.', 'success'); }
        else { await apiFetch('POST', '/tests', t); toast('테스트가 저장되었습니다! 🎉', 'success'); }
        S.editing = null; S.editorFormat = null;
        S.editorTest = { title: '', description: '', questions: [], isPublic: true, isFriendOnly: false, tags: [], format: 'section' };
        await loadData(); renderPage('home');
      } catch (e) { toast(e.message, 'error'); }
    }

    /* ============================================================
       TEST SESSION — 랜덤 순서 + 나가기 버튼
    ============================================================ */
    async function startTest(id, orderMode = 'shuffle', countLimit = 9999) {
      try {
        const test = await apiFetch('GET', `/tests/${id}`);
        if (!test.questions?.length) { toast('문항이 없는 테스트입니다.', 'error'); return; }

        // 랜덤 or 순서 적용
        let qs = [...test.questions];
        if (orderMode === 'shuffle') qs = shuffle(qs);
        qs = qs.slice(0, Math.min(countLimit, qs.length));
        test.questions = qs;

        S.activeTest = test; S.activeQIdx = 0;
        S.answers = []; S.correct = 0; S.wrong = 0;
        S.answered = false; S.selectedOpt = null;
        S.startTime = Date.now(); S.elapsed = 0;
        S.generatedOptions = [];

        S.testTimeLimitSec = 0;
        // 주관식/서술형 문항 지정
        if (test.format === 'essay') {
          test.questions.forEach(q => { q.isSubjective = true; q.timeLimit = 0; });
          S.testTimeLimitSec = test.testTimeLimit || 0;
        } else if (S.includeSubjective && test.questions.length >= 5) {
          const subjCount = Math.min(S._subjCount || Math.max(1, Math.round(test.questions.length * 0.1)), test.questions.length);
          const indices = shuffle([...Array(test.questions.length).keys()]).slice(0, subjCount);
          test.questions.forEach((q, i) => {
            q.isSubjective = indices.includes(i);
            if (q.isSubjective) q.timeLimit = 0;
          });
        } else {
          test.questions.forEach(q => { q.isSubjective = false; });
        }

        if (test.format === 'cell') {
          renderPage('test');
          generateAllOptions(test);
        } else {
          renderPage('test'); startGlobalTimer();
        }
      } catch (e) { toast(e.message, 'error'); }
    }

    async function generateAllOptions(test) {
      try {
        const payload = test.questions.map(q => ({ question: q.question, answer: q.answer }));
        const results = await apiFetch('POST', '/generate-options', { questions: payload });
        S.generatedOptions = results;
        results.forEach((r, i) => {
          if (S.activeTest.questions[i]) {
            S.activeTest.questions[i].options = r.options;
            S.activeTest.questions[i].correctAnswer = r.correctAnswer;
          }
        });
        buildTest(document.getElementById('app'));
        startGlobalTimer();
      } catch (e) {
        toast('보기 생성 실패, 기본 방식으로 진행합니다.', 'error');
        buildTest(document.getElementById('app'));
        startGlobalTimer();
      }
    }

    function startGlobalTimer() {
      clearInterval(S.timer);
      S.timer = setInterval(() => {
        S.elapsed = Math.floor((Date.now() - S.startTime) / 1000);
        const el = document.getElementById('g-timer');
        if (S.testTimeLimitSec && S.testTimeLimitSec > 0) {
          const remaining = S.testTimeLimitSec - S.elapsed;
          if (el) el.textContent = remaining > 0 ? fmtTime(remaining) : '00:00';
          if (el && remaining <= 60) el.style.color = 'var(--accent2)';
          if (remaining <= 0) { clearInterval(S.timer); toast('시간이 종료되었습니다!', 'error'); finishTest(); return; }
        } else {
          if (el) el.textContent = fmtTime(S.elapsed);
        }
      }, 1000);
    }

    function startQuestionTimer(timeLimit) {
      clearInterval(S.qTimer);
      S.qElapsed = 0; S.qTimeLimit = timeLimit;
      if (!timeLimit) return;
      S.qTimer = setInterval(() => {
        S.qElapsed++;
        const fill = document.getElementById('q-cd-fill');
        const pct = Math.max(0, ((timeLimit - S.qElapsed) / timeLimit) * 100);
        if (fill) {
          fill.style.width = pct + '%';
          if (pct < 30) fill.classList.add('urgent'); else fill.classList.remove('urgent');
        }
        if (S.qElapsed >= timeLimit && !S.answered) timeUp();
      }, 1000);
    }

    function timeUp() {
      clearInterval(S.qTimer);
      if (S.answered) return;
      S.answered = true; S.selectedOpt = -1;
      const q = S.activeTest.questions[S.activeQIdx];
      S.wrong++; S.answers.push({ selectedAnswer: -1, isCorrect: false });
      document.querySelectorAll('.opt-btn').forEach((b, i) => { b.disabled = true; if (i === q.correctAnswer) b.classList.add('correct'); });
      const fb = document.getElementById('fb-area');
      if (fb) fb.innerHTML = `<div class="answer-fb no">⏰ 시간 초과! 정답: <strong>${esc(q.options[q.correctAnswer])}</strong></div>`;
      const nb = document.getElementById('next-bar');
      if (nb) nb.style.display = 'block';
    }

    function buildTest(app) {
      const test = S.activeTest;
      const qi = S.activeQIdx;
      const q = test.questions[qi];
      const total = test.questions.length;
      const pct = Math.round((qi / total) * 100);
      const letters = ['A', 'B', 'C', 'D', 'E'];
      const isCellLoading = test.format === 'cell' && S.generatedOptions.length === 0;
      const timeLimit = q?.timeLimit || 0;

      app.innerHTML = `
  <div class="page active" style="flex-direction:column;height:100dvh;overflow:hidden">
    <div class="test-topbar">
      <div class="test-top-row">
        <div>
          <div class="test-title-sm">${esc(test.title)}</div>
          <div class="test-q-count">${qi + 1} / ${total} 문항</div>
        </div>
        <div class="test-stats-right">
          <span class="s-correct">✓ ${S.correct}</span>
          <span class="s-wrong">✗ ${S.wrong}</span>
          <span class="test-timer-display" id="g-timer">${fmtTime(S.elapsed)}</span>
          <button class="quit-test-btn" onclick="confirmQuit()">나가기</button>
        </div>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      ${timeLimit > 0 ? `<div class="q-countdown-bar"><div class="q-countdown-fill" id="q-cd-fill" style="width:100%"></div></div>` : ''}
    </div>

    <div class="test-scroll" style="padding-bottom:${S.answered ? '100px' : '24px'}">
      ${isCellLoading ? `
        <div class="ai-loading">
          <div class="ai-spin"></div>
          <div class="ai-text">AI가 보기를 생성하고 있어요...</div>
        </div>
      `: `
        <div class="q-display">
          <div class="q-type-badge ${q.isSubjective ? 'subj' : ''}">${q.isSubjective ? ic('pencil',13)+' 주관식' : q.questionType === 'en-to-ko' ? '🇺🇸 영어 → 한글' : '🇰🇷 한글 → 영어'}</div>
          <div class="q-word">${esc(q.question)}</div>
          <div class="q-hint">${q.isSubjective ? '정답을 직접 입력하세요' : q.questionType === 'en-to-ko' ? '뜻을 고르세요' : '영어 단어를 고르세요'}</div>
        </div>
        ${q.isSubjective ? `
        <div class="subj-input-wrap">
          <input type="text" class="subj-input" id="subj-ans" placeholder="정답 입력..."
            ${S.answered ? 'disabled' : ''}
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            onkeydown="if(event.key==='Enter')submitSubjective()"/>
          <button class="subj-submit" id="subj-btn" onclick="submitSubjective()" ${S.answered ? 'disabled' : ''}>
            제출
          </button>
        </div>
        `: `
        <div class="opts-grid" id="opts-grid">
          ${(q.options || []).map((opt, oi) => `
            <button class="opt-btn" id="ob-${oi}" onclick="selectOpt(${oi})" ${S.answered ? 'disabled' : ''}>
              <span class="opt-letter">${letters[oi] || oi + 1}</span>${esc(opt)}
            </button>`).join('')}
        </div>`}
        <div id="fb-area"></div>
      `}
    </div>

    <div id="next-bar" class="next-bar" style="display:${S.answered ? 'block' : 'none'}">
      <button class="btn primary" onclick="${qi + 1 < total ? 'nextQ()' : 'finishTest()'}">
        ${qi + 1 < total ? '다음 문항 →' : '🏁 결과 보기'}
      </button>
    </div>
  </div>`;

      if (S.answered && S.selectedOpt !== null && S.selectedOpt !== -2) showFeedback(S.selectedOpt, q);
      if (S.answered && S.selectedOpt === -2) {
        // 주관식 — 이미 답변됨, 입력창 비활성화
        const inp = document.getElementById('subj-ans');
        if (inp) inp.disabled = true;
      }
      if (!isCellLoading && !S.answered && timeLimit > 0 && !q.isSubjective) startQuestionTimer(timeLimit);
    }

    function toggleSubjective() {
      S.includeSubjective = !S.includeSubjective;
      const tog = document.getElementById('subj-toggle');
      if (tog) tog.className = 'toggle' + (S.includeSubjective ? ' on' : '');
      const row = document.getElementById('subj-count-row');
      if (row) row.style.display = S.includeSubjective ? 'flex' : 'none';
    }

    function submitSubjective() {
      if (S.answered) return;
      const input = document.getElementById('subj-ans');
      const val = (input?.value || '').trim();
      if (!val) { toast('정답을 입력해주세요.', 'error'); return; }

      const q = S.activeTest.questions[S.activeQIdx];
      const correct = (q.answer || q.options?.[q.correctAnswer] || '').trim();
      let ok;
      if (S.activeTest.format === 'essay' && q.keywords?.length > 0) {
        const lv = val.toLowerCase();
        const matched = q.keywords.filter(kw => lv.includes(kw.toLowerCase()));
        ok = matched.length >= q.keywords.length;
      } else {
        ok = val.toLowerCase() === correct.toLowerCase();
      }

      S.answered = true; S.selectedOpt = -2; // -2 = 주관식
      if (ok) S.correct++; else S.wrong++;
      S.answers.push({ selectedAnswer: -2, isCorrect: ok, subjectiveAnswer: val });

      // 입력창 스타일
      if (input) { input.disabled = true; input.className = 'subj-input ' + (ok ? 'correct' : 'wrong'); }
      const btn = document.getElementById('subj-btn');
      if (btn) btn.disabled = true;

      // 피드백
      const fb = document.getElementById('fb-area');
      if (fb) fb.innerHTML = `<div class="answer-fb ${ok ? 'ok' : 'no'}">
    ${ok ? '✅ 정답입니다!' : `❌ 오답! 정답: <strong>${esc(correct)}</strong>`}
  </div>`;

      document.getElementById('next-bar').style.display = 'block';
      setTimeout(() => { if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 100);
    }

    function selectOpt(oi) {
      if (S.answered) return;
      clearInterval(S.qTimer);
      S.answered = true; S.selectedOpt = oi;
      const q = S.activeTest.questions[S.activeQIdx];
      const ok = oi === q.correctAnswer;
      if (ok) S.correct++; else S.wrong++;
      // isCorrect를 함께 전송 — 셀 방식은 DB correctAnswer와 다를 수 있으므로 클라이언트 판정 우선
      S.answers.push({ selectedAnswer: oi, isCorrect: ok });
      showFeedback(oi, q);
      document.getElementById('next-bar').style.display = 'block';
      setTimeout(() => { const fb = document.getElementById('fb-area'); if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 100);
    }

    function showFeedback(oi, q) {
      const ok = oi === q.correctAnswer;
      document.querySelectorAll('.opt-btn').forEach((b, i) => {
        b.disabled = true;
        if (i === q.correctAnswer) b.classList.add('correct');
        else if (i === oi && !ok) b.classList.add('wrong');
      });
      const fb = document.getElementById('fb-area');
      if (fb) fb.innerHTML = `<div class="answer-fb ${ok ? 'ok' : 'no'}">
    ${ok ? '✅ 정답입니다!' : `❌ 오답! 정답: <strong>${esc(q.options[q.correctAnswer])}</strong>`}
  </div>`;
    }

    function nextQ() {
      clearInterval(S.qTimer);
      S.activeQIdx++; S.answered = false; S.selectedOpt = null;
      buildTest(document.getElementById('app')); startGlobalTimer();
    }

    async function finishTest() {
      clearInterval(S.timer); clearInterval(S.qTimer);
      try {
        const totalQuestions = S.answers.length;
        const correctAnswers = S.correct;
        const result = await apiFetch('POST', '/results', {
          testId: S.activeTest._id,
          answers: S.answers,
          timeTaken: S.elapsed,
          correctAnswers,
          totalQuestions
        });
        S.lastResult = { ...result, test: S.activeTest };
        renderPage('result');
      } catch (e) { toast(e.message, 'error'); renderPage('home'); }
    }

    /* ============================================================
       RESULT
    ============================================================ */
    let resultFilter = 'all'; // 'all' | 'wrong'

    function buildResult(app) {
      const r = S.lastResult;
      if (!r) { renderPage('home'); return; }
      const pct = r.percentage;
      const grade = pct >= 90 ? '🏆 완벽해요!' : pct >= 70 ? '😊 잘 했어요!' : pct >= 50 ? '😐 조금 더 노력해봐요' : '😥 다시 도전해봐요';
      const gc = pct >= 80 ? 'var(--accent3)' : pct >= 50 ? 'var(--accent)' : 'var(--accent2)';
      const emoji = pct >= 90 ? '🎉' : pct >= 70 ? '👍' : pct >= 50 ? '📚' : '💪';
      const test = r.test;
      resultFilter = 'all';

      app.innerHTML = topNav() + `
  <div class="page active">
    <div class="result-scroll">
      <div class="result-hdr">
        <span class="result-emoji">${emoji}</span>
        <h1 class="result-title">${grade}</h1>
        <p class="result-sub">${esc(r.testTitle || test?.title || '')}</p>
      </div>
      <div class="result-score-card">
        <div class="score-pct" style="color:${gc}">${pct}%</div>
        <div class="score-sub">정답률 · ${fmtTime(r.timeTaken || 0)} 소요</div>
      </div>
      <div class="result-bk">
        <div class="bk-item"><div class="bk-num ok">${r.correctAnswers}</div><div class="bk-label">정답</div></div>
        <div class="bk-item"><div class="bk-num no">${r.wrongAnswers}</div><div class="bk-label">오답</div></div>
        <div class="bk-item"><div class="bk-num tot">${r.totalQuestions}</div><div class="bk-label">총 문항</div></div>
      </div>

      <!-- 2열 그리드: 왼쪽=정오표, 오른쪽=차트 -->
      <div class="result-body-grid">

        <!-- 왼쪽: 정오표 -->
        <div class="result-left-col">
          ${test?.questions ? `
          <div class="result-filter-row" style="padding:0;margin-bottom:12px">
            <button class="result-filter-btn active" id="filter-all" onclick="setResultFilter('all')">${ic('clipboard',13)} 전체 (${test.questions.length})</button>
            <button class="result-filter-btn" id="filter-wrong" onclick="setResultFilter('wrong')">❌ 오답 (${r.wrongAnswers})</button>
          </div>
          <div style="font-size:.82rem;font-weight:700;color:var(--text2);margin-bottom:10px">${ic('clipboard',14)} 문항 리뷰</div>
          <div class="review-list" id="review-list">
            ${buildReviewItems(test.questions, r.answers, 'all')}
          </div>`: ''}
        </div>

        <!-- 오른쪽: 차트 -->
        <div class="result-right-col">
          <div class="chart-section in-grid">
            <div class="chart-title">${ic('chart',14)} 상세 분석</div>
            <div class="rank-tabs" style="margin-bottom:12px">
              <div class="rank-tab active" id="ct-accuracy" onclick="switchChartTab('accuracy')">정답/오답</div>
              <div class="rank-tab" id="ct-time" onclick="switchChartTab('time')">문제별 시간</div>
              <div class="rank-tab" id="ct-trend" onclick="switchChartTab('trend')">누적 정답률</div>
            </div>
            <div class="chart-wrap"><canvas id="result-chart" class="chart-canvas-tall"></canvas></div>
          </div>
        </div>
      </div>

      ${r.wrongAnswers > 0 ? `
      <!-- 오답노트 저장 안내 -->
      <div style="margin:0 16px 20px;background:rgba(255,101,132,.07);border:1.5px solid rgba(255,101,132,.2);border-radius:var(--radius);padding:14px 16px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:1.4rem">${ic('notebook',22)}</span>
          <div style="flex:1">
            <div style="font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:2px">오답노트에 저장할까요?</div>
            <div style="font-size:.75rem;color:var(--text2)">틀린 단어 ${r.wrongAnswers}개를 오답노트에 추가합니다</div>
          </div>
          <button class="btn primary sm" id="wn-save-btn" onclick="promptSaveWrongNote()">저장</button>
        </div>
      </div>`: ''}
    </div>
    <div class="result-actions-bar">
      <button class="btn ghost" onclick="goHome()">🏠 홈으로</button>
      <button class="btn primary" onclick="openTestMethodPicker('${test?._id || r.test}')">🔄 다시 도전</button>
    </div>
  </div>`;

      // 차트 초기화 (약간 지연)
      setTimeout(() => renderResultChart('accuracy', r, test), 100);
    }

    function buildReviewItems(questions, answers, filter) {
      const items = questions.map((q, i) => {
        const ans = answers?.[i]; const isOk = ans?.isCorrect;
        if (filter === 'wrong' && isOk) return '';
        const isSubj = ans?.selectedAnswer === -2;
        const selOpt = isSubj ? (ans?.subjectiveAnswer || '(입력 없음)') : ans?.selectedAnswer != null && ans.selectedAnswer >= 0 ? q.options[ans.selectedAnswer] : '시간 초과';
        const corrOpt = isSubj ? (q.answer || q.options?.[q.correctAnswer] || '') : q.options?.[q.correctAnswer] || '';
        return `<div class="review-item">
      <div class="review-icon ${isOk ? 'ok' : 'no'}">${isOk ? '✓' : '✗'}</div>
      <div style="min-width:0;flex:1">
        <div class="review-q"><span style="color:var(--text3);font-size:.72rem;margin-right:4px">Q${i + 1}</span>${esc(q.question)}</div>
        <div class="review-a">${!isOk ? `<span class="no-ans">${esc(selOpt)}</span>` : ''}  <span class="ok-ans">✓ ${esc(corrOpt)}</span></div>
      </div>
    </div>`;
      }).join('');
      return items || `<div style="text-align:center;padding:28px;color:var(--text3);font-size:.875rem">오답이 없어요! 🎉</div>`;
    }

    function setResultFilter(filter) {
      resultFilter = filter;
      const r = S.lastResult; const test = r?.test;
      if (!test?.questions) return;
      document.getElementById('filter-all')?.classList.toggle('active', filter === 'all');
      document.getElementById('filter-wrong')?.classList.toggle('active', filter === 'wrong');
      const list = document.getElementById('review-list');
      if (list) list.innerHTML = buildReviewItems(test.questions, r.answers, filter);
    }

    let _resultChart = null;
    function switchChartTab(tab) {
      ['accuracy', 'time', 'trend'].forEach(t => {
        document.getElementById('ct-' + t)?.classList.toggle('active', t === tab);
      });
      renderResultChart(tab, S.lastResult, S.lastResult?.test);
    }

    function renderResultChart(type, r, test) {
      if (_resultChart) { _resultChart.destroy(); _resultChart = null; }
      const canvas = document.getElementById('result-chart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const isDark = !document.body.classList.contains('theme-light');
      const textColor = isDark ? '#9191a8' : '#44445a';
      const gridColor = isDark ? 'rgba(42,42,56,.7)' : 'rgba(220,220,232,.8)';
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6c63ff';
      const accent2 = '#ff6584', accent3 = '#43e97b';

      const commonFont = { family: "'Noto Sans KR', sans-serif", size: 12 };

      if (type === 'accuracy') {
        // 도넛 — 정답 vs 오답 (크게)
        _resultChart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['정답', '오답'],
            datasets: [{
              data: [r.correctAnswers, r.wrongAnswers],
              backgroundColor: [accent3, accent2],
              borderWidth: 3,
              borderColor: isDark ? '#1c1c25' : '#ffffff',
              hoverOffset: 10
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '62%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: textColor, font: { ...commonFont, size: 13 }, padding: 24, boxWidth: 14, boxHeight: 14 }
              },
              tooltip: {
                callbacks: {
                  label: ctx => `${ctx.label}: ${ctx.raw}문항 (${r.totalQuestions ? Math.round(ctx.raw / r.totalQuestions * 100) : 0}%)`
                }
              }
            }
          }
        });
      } else if (type === 'time') {
        // 바 — 문항별 소요시간
        const qs = test?.questions || [];
        if (!qs.length) { canvas.parentElement.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3);font-size:.875rem">문항 데이터 없음</div>'; return; }
        const totalSec = r.timeTaken || 0;
        const avgSec = qs.length ? Math.round(totalSec / qs.length) : 0;
        const timings = r.answers?.map(a => typeof a.timeTaken === 'number' && a.timeTaken > 0 ? a.timeTaken : avgSec) || qs.map(() => avgSec);
        const bkColors = r.answers?.map(a => a.isCorrect ? accent3 + 'cc' : accent2 + 'cc') || qs.map(() => accent + 'cc');
        const borderColors = r.answers?.map(a => a.isCorrect ? accent3 : accent2) || qs.map(() => accent);
        _resultChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: qs.map((_, i) => `Q${i + 1}`),
            datasets: [{
              label: '소요시간(초)',
              data: timings,
              backgroundColor: bkColors,
              borderColor: borderColors,
              borderWidth: 1.5,
              borderRadius: 6,
              borderSkipped: false,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  title: ctx => `Q${ctx[0].dataIndex + 1}: ${esc(qs[ctx[0].dataIndex]?.question || '')}`.slice(0, 40),
                  label: ctx => `${ctx.raw}초 · ${r.answers?.[ctx.dataIndex]?.isCorrect ? '✓ 정답' : '✗ 오답'}`
                }
              }
            },
            scales: {
              x: { ticks: { color: textColor, font: commonFont }, grid: { color: gridColor }, border: { color: 'transparent' } },
              y: { ticks: { color: textColor, font: commonFont, callback: v => v + '초' }, grid: { color: gridColor }, beginAtZero: true, border: { color: 'transparent' } }
            }
          }
        });
      } else if (type === 'trend') {
        // 라인 — 누적 정답률
        const ans = r.answers || [];
        if (!ans.length) { canvas.parentElement.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3);font-size:.875rem">응답 데이터 없음</div>'; return; }
        let correct = 0;
        const trendData = ans.map((a, i) => {
          if (a.isCorrect) correct++;
          return parseFloat(((correct / (i + 1)) * 100).toFixed(1));
        });
        // 각 포인트가 정답인지 오답인지 배경색 지정
        const ptColors = ans.map(a => a.isCorrect ? accent3 : accent2);
        const ptRadius = ans.map(() => 5);
        _resultChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: ans.map((_, i) => `Q${i + 1}`),
            datasets: [{
              label: '누적 정답률',
              data: trendData,
              borderColor: accent,
              borderWidth: 2.5,
              backgroundColor: accent + '22',
              fill: true,
              tension: 0.35,
              pointBackgroundColor: ptColors,
              pointBorderColor: ptColors,
              pointRadius: ptRadius,
              pointHoverRadius: 7,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  title: ctx => `Q${ctx[0].dataIndex + 1}`,
                  label: ctx => `누적 정답률: ${ctx.raw}%  ${ans[ctx[0].dataIndex]?.isCorrect ? '✓ 정답' : '✗ 오답'}`
                }
              }
            },
            scales: {
              x: { ticks: { color: textColor, font: commonFont }, grid: { color: gridColor }, border: { color: 'transparent' } },
              y: {
                ticks: { color: textColor, font: commonFont, callback: v => v + '%', stepSize: 10 },
                grid: { color: gridColor }, min: 0, max: 100,
                border: { color: 'transparent' }
              }
            }
          }
        });
      }
    }

    /* ============================================================
       HISTORY

        ${S.history.length === 0 ? `<div class="empty-state"><h3>아직 응시 기록이 없어요</h3><p>테스트를 풀고 성적을 확인해보세요!</p></div>` : `
        <div class="history-list">
          ${S.history.map(r => {

        </div>`}
      </div>
    </div>
  </div>`+ bottomNav('history');
    }

    /* ============================================================
       PROFILE (개선 — 배너/아바타/닉네임 상단 + 친구 목록)
    ============================================================ */
    function getBannerStyle() {

    /* ── 이미지 압축 헬퍼 (canvas 리사이즈) ── */
    function compressImage(file, maxW, maxH, quality = 0.82) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxW || h > maxH) {
              const r = Math.min(maxW / w, maxH / h);
              w = Math.round(w * r); h = Math.round(h * r);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    /* ── 아바타 업로드 ── */
    async function handleAvatarUpload(input) {
      const file = input.files[0];

      try {
        toast('업로드 중...', 'info');
        const b64 = await compressImage(file, 400, 400, 0.85);
        await apiFetch('PUT', '/auth/profile', { avatarImage: b64 });
        S.profile.avatarImage = b64;
        // 프로필 화면 아바타

        if (inner) inner.innerHTML = `<img src="${b64}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        // 상단 네비 아바타
        const navAvatar = document.querySelector('.nav-avatar');
        if (navAvatar) { navAvatar.style.background = 'none'; navAvatar.style.padding = '0'; navAvatar.style.overflow = 'hidden'; navAvatar.innerHTML = `<img src="${b64}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`; }
        toast('프로필 사진이 변경되었습니다 ✨', 'success');
      } catch (e) { toast(e.message || '업로드 실패', 'error'); }
      input.value = '';
    }

    async function submitNotice() {
      const title = document.getElementById('notice-title')?.value?.trim();
      const content = document.getElementById('notice-content')?.value?.trim();
      const isPinned = document.getElementById('notice-pin')?.checked;
      if (!title || !content) { toast('제목과 내용을 입력해주세요.', 'error'); return; }

        await apiFetch('POST', '/notices', { title, content, isPinned });
        toast('공지사항이 게시되었습니다.', 'success');
        closeModal();
        const notices = await fetch(API + '/notices').then(r => r.json());

        buildNotice(document.getElementById('app'));

      if (!confirm('공지사항을 삭제할까요?')) return;
      try {
        await apiFetch('DELETE', `/notices/${id}`);
        toast('삭제되었습니다.', 'info');
        closeModal();
        const notices = await fetch(API + '/notices').then(r => r.json());
        S.notices = notices;
        buildNotice(document.getElementById('app'));
      } catch (e) { toast(e.message, 'error'); }

    async function loadRanking(tab) {
      const el = document.getElementById('ranking-content');
      if (!el) return;
      try {
        const endpoint = tab === 'friends' ? '/ranking/friends' : '/ranking';
        const data = await apiFetch('GET', endpoint);
        renderRankingContent(el, data, tab);
      } catch (e) {
        el.innerHTML = `<div class="rank-loading">랭킹 정보를 불러올 수 없어요.<br><span style="font-size:.78rem">${esc(e.message)}</span></div>`;
      }
    }

    function renderRankingContent(el, data, tab) {
      const list = data.ranking || [];
      const myRank = data.myRank;

      if (!list.length) {
        el.innerHTML = `<div class="rank-loading">아직 랭킹 데이터가 없어요!<br><span style="font-size:.78rem">테스트를 풀면 랭킹에 등록됩니다.</span></div>`;
        return;
      }

      const gc = p => p >= 80 ? 'var(--accent3)' : p >= 50 ? 'var(--accent)' : 'var(--accent2)';
      const top3 = list.slice(0, 3);
      const rest = list.slice(3);

      // 포디움
      let podiumHTML = '';
      if (top3.length) {
        const [first, second, third] = [top3[0], top3[1], top3[2]];
        const podItem = (u, rank, cls, crown, placeNum) => u ? `
      <div class="rank-podium-item ${cls}" onclick="goToUserPage('${esc(u.username)}')" style="cursor:pointer">
        <div class="rank-crown">${crown}</div>
        <div class="rank-avatar ${cls}" style="${u._id === S.user?.id ? 'outline:3px solid var(--accent);outline-offset:2px' : ''}">
          ${u.avatarImage ? `<img src="${u.avatarImage}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (u.username?.[0]?.toUpperCase() || '?')}
        </div>
        <div class="rank-podium-name">${esc(u.username)}${u._id === S.user?.id ? ' 👈' : ''}</div>
        <div class="rank-podium-pct" style="color:${gc(u.avgScore)}">${u.avgScore}%</div>
        <div class="rank-podium-bar ${cls}"><span class="rank-place">${placeNum}</span></div>
      </div>` : `<div class="rank-podium-item ${cls}"><div class="rank-crown" style="opacity:.2">${crown}</div><div class="rank-avatar ${cls}" style="opacity:.25">-</div><div class="rank-podium-bar ${cls}"><span class="rank-place">${placeNum}</span></div></div>`;
        podiumHTML = `<div class="rank-podium">
      ${podItem(second, '2', 'second', '🥈', '2')}
      ${podItem(first, '1', 'first', '🥇', '1')}
      ${podItem(third, '3', 'third', '🥉', '3')}
    </div>`;
      }

      // 4위 이하 리스트
      const restHTML = rest.map((u, i) => {
        const isMe = u._id === S.user?.id;
        const rank = i + 4;
        return `<div class="rank-item${isMe ? ' rank-me' : ''}" onclick="${isMe ? '' : `goToUserPage('${esc(u.username)}')`}" style="${isMe ? '' : 'cursor:pointer'}">
      <div class="rank-num">${rank}</div>
      <div class="rank-item-avatar" style="${isMe ? 'background:var(--accent)' : ''}">
        ${u.avatarImage ? `<img src="${u.avatarImage}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (u.username?.[0]?.toUpperCase() || '?')}
      </div>
      <div class="rank-item-info">
        <div class="rank-item-name">${esc(u.username)}${isMe ? ' 👈' : ''}</div>
        <div class="rank-item-sub">${u.totalAttempts}회 응시 · 최고 ${u.bestScore}%</div>
      </div>
      <div class="rank-item-score" style="color:${gc(u.avgScore)}">${u.avgScore}%</div>
    </div>`;
      }).join('');

      // 내 랭크 바 (랭킹에 없는 경우만 or 항상)
      let myBarHTML = '';
      if (myRank) {
        const isInList = list.some(u => u._id === S.user?.id);
        if (!isInList) {
          myBarHTML = `<div class="rank-my-bar">
        <div class="rank-my-label">📍 내 랭킹</div>
        <div class="rank-my-row">
          <div class="rank-num">${myRank.rank}</div>
          <div class="rank-item-avatar" style="background:var(--accent)">${S.user?.username?.[0]?.toUpperCase() || '?'}</div>
          <div class="rank-item-info">
            <div class="rank-item-name">${esc(S.user?.username || '나')}</div>
            <div class="rank-item-sub">${myRank.totalAttempts}회 응시 · 최고 ${myRank.bestScore}%</div>
          </div>
          <div class="rank-item-score" style="color:${gc(myRank.avgScore)}">${myRank.avgScore}%</div>
        </div>
      </div>`;
        }
      }

      el.innerHTML = podiumHTML
        + (rest.length ? `<div class="rank-list">${restHTML}</div>` : '')
        + myBarHTML
        + `<div style="text-align:center;margin-top:16px;font-size:.72rem;color:var(--text3)">* 랭킹 기준: 평균 정답률 (최소 1회 응시)</div>`;
    }
    let _inqSort = 'newest';

    function buildInquiry(app) {
      app.innerHTML = topNav('inquiry') + `
  <div class="page active">

          <span class="sec-title" style="font-size:1.08rem">${ic('chat')} 문의하기</span>
          <button class="btn primary sm" onclick="showInquiryForm()">+ 문의</button>
        </div>
        <div class="inq-tabs-row">
          <div class="inq-tab ${_inqFilter==='all'?'active':''}" onclick="setInqFilter('all')">전체</div>

        </div>

    function setInqFilter(f) {
      _inqFilter = f;

      renderInquiryList();

    function toggleInqSort() {
      _inqSort = _inqSort === 'newest' ? 'likes' : 'newest';
      const lbl = document.getElementById('inq-sort-label');

    async function loadInquiries() {
      try {
        _inqCache = await apiFetch('GET', '/inquiries');
        renderInquiryList();
      } catch (e) { toast(e.message, 'error'); }
    }

    function renderInquiryList() {
      const el = document.getElementById('inquiry-list');
      if (!el) return;
      let list = [..._inqCache];
      if (_inqFilter === 'mine') list = list.filter(q => (q.user?._id || q.user) === S.user?.id);
      if (_inqSort === 'likes') list.sort((a,b) => (b.likes?.length||0) - (a.likes?.length||0));
      if (!list.length) { el.innerHTML = `<div class="empty-state"><h3>${_inqFilter==='mine'?'내 문의가 없어요':'문의가 없어요'}</h3><p>궁금한 점을 문의해보세요!</p></div>`; return; }
      el.innerHTML = list.map(q => {
        const isOwn = (q.user?._id || q.user) === S.user?.id;
        const liked = (q.likes||[]).some(id => id === S.user?.id || id?._id === S.user?.id);
        const likeCount = (q.likes||[]).length;
        const typeMatch = q.title.match(/^\[(건의|문의|신고)\]\s*/);
        const typeTag = typeMatch ? `<span class="inq-type-tag ${typeMatch[1]}">${typeMatch[1]}</span>` : '';
        const titleDisp = q.title.replace(/^\[(건의|문의|신고)\]\s*/, '');
        const date = new Date(q.createdAt).toLocaleDateString('ko-KR');
        const authorName = q.user?.username || (isOwn ? (S.user?.username||'나') : '알 수 없음');
        return `
      <div class="inquiry-item">
        <div class="inq-item-top">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="inquiry-status ${q.status}">${q.status === 'answered' ? '✓ 답변완료' : '대기중'}</span>
            ${typeTag}
          </div>
          <button class="inq-like-btn ${liked?'active':''}" onclick="toggleInqLike('${q._id}',this)">
            ${ic('heart',13)} <span>${likeCount||''}</span>
          </button>
        </div>
        <div class="inquiry-title">${esc(titleDisp)}</div>
        <div class="inquiry-content">${esc(q.content)}</div>
        <div class="inq-item-meta"><span style="cursor:pointer;text-decoration:underline;text-decoration-color:var(--border)" onclick="goToUserPage('${esc(authorName)}')">${esc(authorName)}</span> · ${date}</div>
        ${q.status === 'answered' ? `
          <div class="inquiry-answer">
            <span class="inquiry-answer-label">${ic('chat',13)} 답변</span>
            <span class="inquiry-answer-text">${esc(q.answer)}</span>
          </div>` : ''}
      </div>`;
      }).join('');
    }

    async function toggleInqLike(id, btn) {
      try {
        const res = await apiFetch('POST', '/inquiries/'+id+'/like');
        const cached = _inqCache.find(q => q._id === id);
        if (cached) {
          if (res.liked) { if (!cached.likes) cached.likes = []; cached.likes.push(S.user?.id); }
          else { cached.likes = (cached.likes||[]).filter(lid => (lid?._id||lid) !== S.user?.id); }
        }
        if (btn) {
          btn.classList.toggle('active', res.liked);
          const sp = btn.querySelector('span');
          if (sp) sp.textContent = res.likes || '';
        }
      } catch (e) { toast(e.message, 'error'); }
    }

    function renderAdminCharts(data) {
      const isDark = !document.body.classList.contains('theme-light');
      const textColor = isDark ? '#9191a8' : '#44445a';
      const gridColor = isDark ? 'rgba(42,42,56,.7)' : 'rgba(220,220,232,.8)';
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6c63ff';
      const accent3 = '#43e97b', accent4 = '#ffd166';
      const commonFont = { family: "'Noto Sans KR', sans-serif", size: 11 };

      const shortLabels = data.labels.map(d => {
        const [, m, day] = d.split('-');
        return `${parseInt(m)}/${parseInt(day)}`;
      });

      // ── 핵심: maintainAspectRatio:true + aspectRatio로 높이를 완전히 Chart.js에 위임
      //    → 부모 div 높이를 canvas가 밀어올리는 무한루프 원천 차단
      const commonOpts = () => ({
        responsive: true,
        maintainAspectRatio: true,
        aspectRatio: 3,          // width:height = 3:1 고정
        animation: { duration: 400 },
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            callbacks: { title: items => data.labels[items[0].dataIndex] }
          }
        },
        scales: {
          x: {
            ticks: { color: textColor, font: commonFont, maxRotation: 45, autoSkip: true, maxTicksLimit: 15 },
            grid: { color: gridColor },
            border: { color: 'transparent' }
          },
          y: {
            ticks: { color: textColor, font: commonFont, stepSize: 1, callback: v => Number.isInteger(v) ? v : '' },
            grid: { color: gridColor },
            beginAtZero: true,
            border: { color: 'transparent' }
          }
        }
      });

      const makeBar = (canvasId, dataset, color) => {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return null;
        // 이미 Chart 인스턴스가 붙어있으면 파기 (안전장치)
        const existing = Chart.getChart(canvas);
        if (existing) existing.destroy();

        return new Chart(canvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels: shortLabels,
            datasets: [{
              data: dataset,
              backgroundColor: color + '55',
              borderColor: color,
              borderWidth: 1.5,
              borderRadius: 4,
              borderSkipped: false,
              hoverBackgroundColor: color + 'aa'
            }]
          },
          options: commonOpts()
        });
      };

      _adminCharts.users = makeBar('adm-chart-users', data.newUsers, accent);
      _adminCharts.results = makeBar('adm-chart-results', data.testResults, accent3);
      _adminCharts.tests = makeBar('adm-chart-tests', data.newTests, accent4);
    }

    async function fetchAndRenderLogs() {
      try {
        const qs = new URLSearchParams({
          limit: 500,
          level: _adminLogState.level,
          search: _adminLogState.search
        });
        const data = await apiFetch('GET', `/admin/logs?${qs}`);
        renderLogList(data.logs, data.total);
      } catch (e) {
        const body = document.getElementById('log-list-body');
        if (body) body.innerHTML = `<div class="log-empty" style="color:var(--accent2)">로그를 불러올 수 없습니다: ${esc(e.message)}</div>`;
      }
    }

    function renderLogList(logs, total) {
      const body = document.getElementById('log-list-body');
      const countEl = document.getElementById('log-count-label');
      if (!body) return;
      if (!logs.length) {
        body.innerHTML = '<div class="log-empty">표시할 로그가 없습니다</div>';
        if (countEl) countEl.textContent = '';
        return;
      }
      const levelIcons = { info: 'INFO', http: 'HTTP', warn: 'WARN', error: 'ERR!' };
      body.innerHTML = logs.map(entry => {
        const ts = new Date(entry.ts).toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\. /g, '-').replace('.', ':');
        const rowClass = entry.level === 'error' ? ' error-row' : entry.level === 'warn' ? ' warn-row' : '';
        return `<div class="log-item${rowClass}">
      <span class="log-ts">${esc(ts)}</span>
      <span class="log-level ${entry.level}">${levelIcons[entry.level] || entry.level.toUpperCase()}</span>
      <span class="log-msg">${esc(entry.message)}</span>
    </div>`;
      }).join('');
      if (countEl) countEl.textContent = `${logs.length}건 표시 / 전체 버퍼 ${total}건`;
    }

    function onLogSearchInput(val) {
      _adminLogState.search = val;
      clearTimeout(_adminLogState.timer);
      _adminLogState.timer = setTimeout(fetchAndRenderLogs, 350);
    }

    function setLogLevel(level) {
      _adminLogState.level = level;
      // 버튼 active 상태 갱신
      document.querySelectorAll('.log-filter-btn').forEach(btn => {
        const cls = [...btn.classList].find(c => ['all', 'info', 'http', 'warn', 'error'].includes(c));
        btn.classList.toggle('active', cls === level);
      });
      fetchAndRenderLogs();
    }

    async function copyLogs() {
      try {
        const qs = new URLSearchParams({ limit: 2000, level: _adminLogState.level, search: _adminLogState.search });
        const data = await apiFetch('GET', `/admin/logs?${qs}`);
        const text = data.logs.map(e => `[${e.ts}] [${e.level.toUpperCase()}] ${e.message}`).join('\n');
        await navigator.clipboard.writeText(text);
        toast(`로그 ${data.logs.length}건이 클립보드에 복사되었습니다`, 'success');
      } catch (e) { toast('복사 실패: ' + e.message, 'error'); }
    }

    async function downloadLogs() {
      try {
        const qs = new URLSearchParams({ limit: 2000, level: _adminLogState.level, search: _adminLogState.search });
        const data = await apiFetch('GET', `/admin/logs?${qs}`);
        const text = data.logs.map(e => `[${e.ts}] [${e.level.toUpperCase()}] ${e.message}`).join('\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const date = new Date().toISOString().slice(0, 16).replace('T', '_').replace(':', '-');
        a.href = url; a.download = `ydmaster_logs_${date}.txt`;
        a.click();
        URL.revokeObjectURL(url);
        toast(`로그 ${data.logs.length}건을 다운로드합니다`, 'success');
      } catch (e) { toast('다운로드 실패: ' + e.message, 'error'); }
    }

      const isSocial = S.user?.loginType && S.user.loginType !== 'local';
      const pw = document.getElementById('del-pw-input')?.value || '';
      if (!isSocial && !pw) { toast('비밀번호를 입력해주세요.', 'error'); return; }

      if (btn) { btn.disabled = true; btn.textContent = '삭제 중...'; }
      try {
        // 소셜 계정은 비밀번호 자리에 더미값 전송 (서버에서 소셜 계정 체크 후 무시)
        await apiFetch('POST', '/auth/account/delete', { password: pw || 'social_delete_bypass' });

        // 즉시 로컬 상태 완전 초기화
        S.token = null; S.user = null; S.isAdmin = false;

        toast('계정이 삭제되었습니다.', 'info');
        setTimeout(() => {
          // 회원가입 탭으로 이동 (처음 가입하는 것처럼)
          renderPage('auth');
          setTimeout(() => { switchTab('r'); }, 100);
        }, 800);

    // ── 오답 단어 추출 (공통 유틸) ──
    function extractWrongWords(r) {
      const test = r?.test;
      if (!test?.questions || !r?.answers) return [];
      return test.questions.reduce((acc, q, i) => {
        const ans = r.answers[i];
        // answers 배열이 서버 응답이면 isCorrect, 로컬이면 isCorrect 모두 있음
        if (!ans || ans.isCorrect) return acc;
        const question = (q.question || '').trim();
        // 정답 추출: 셀방식은 q.answer, 섹션방식은 options[correctAnswer]
        const answer = (q.answer || q.options?.[q.correctAnswer] || '').trim();
        if (question && answer) acc.push({ question, answer });
        return acc;
      }, []);
    }

    // 결과 화면 → 저장 확인 모달
    function promptSaveWrongNote() {
      const r = S.lastResult;
      if (!r?.test) return;

      const wrongWords = extractWrongWords(r);
      if (!wrongWords.length) { toast('저장할 오답이 없어요.', 'info'); return; }

      const previewHTML = wrongWords.slice(0, 6).map(w =>
        `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(var(--border-rgb,42,42,56),.4)">

      <span style="font-size:.85rem;color:var(--accent3);flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.answer)}</span>
    </div>`
      ).join('');
      const moreText = wrongWords.length > 6
        ? `<div style="text-align:center;font-size:.74rem;color:var(--text3);padding:8px 0 4px">외 ${wrongWords.length - 6}개</div>`
        : '';

      const testTitle = r.testTitle || r.test?.title || '';

      showModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">${ic('notebook',18)} 오답노트에 저장</div>
    <div style="font-size:.83rem;color:var(--text2);margin-bottom:12px;line-height:1.6">
      <span style="color:var(--text);font-weight:700">${esc(testTitle)}</span>에서
      틀린 단어 <span style="color:var(--accent2);font-weight:700">${wrongWords.length}개</span>를 오답노트에 추가합니다.
    </div>

    </div>
  `);

      // 임시 보관
      S._pendingWrongWords = {
        testId: r.test?._id || (typeof r.test === 'string' ? r.test : null),
        testTitle: testTitle,
        words: wrongWords
      };

    async function saveWrongNote() {
      const btn = document.getElementById('wn-confirm-btn');
      if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
      try {
        const payload = S._pendingWrongWords;
        if (!payload || !payload.words?.length) throw new Error('저장할 데이터가 없습니다.');
        await apiFetch('POST', '/wrongnote', payload);
        closeModal();
        toast(`📒 오답노트에 ${payload.words.length}개 단어를 저장했습니다!`, 'success');

        const saveBtn = document.getElementById('wn-save-btn');

          saveBtn.textContent = '✓ 저장됨';
          saveBtn.disabled = true;
          saveBtn.style.cssText = 'opacity:.55;cursor:default';
        }
        S._pendingWrongWords = null;
      } catch (e) {
        toast(e.message || '저장 실패', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '✓ 저장하기'; }
      }
