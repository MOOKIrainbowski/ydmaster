    // ── 오답노트 TTS ──
    function wnSpeak(text) {
      if (!text) return;
      if (!('speechSynthesis' in window)) { toast('이 브라우저에서 음성을 지원하지 않습니다.', 'info'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      speechSynthesis.speak(u);
    }

    // ── 오답노트 가리기 토글 ──
    const _wnHide = {};
    function wnToggleHide(gid, lang) {
      if (!_wnHide[gid]) _wnHide[gid] = { ko: false, en: false };
      _wnHide[gid][lang] = !_wnHide[gid][lang];
      const group = document.getElementById('wng-' + gid);
      if (!group) return;
      group.querySelectorAll('.wn-word-item').forEach(item => {
        const qEl = item.querySelector('.wn-word-q');
        const aEl = item.querySelector('.wn-word-a');
        if (!qEl || !aEl) return;
        const qIsKo = /[\uAC00-\uD7AF]/.test(qEl.textContent);
        if (lang === 'ko') {
          const t = qIsKo ? qEl : aEl;
          t.classList.toggle('wn-blurred', _wnHide[gid].ko);
          if (!_wnHide[gid].ko) t.classList.remove('wn-revealed');
        } else {
          const t = qIsKo ? aEl : qEl;
          t.classList.toggle('wn-blurred', _wnHide[gid].en);
          if (!_wnHide[gid].en) t.classList.remove('wn-revealed');
        }
      });
      const btn = group.querySelector('.wn-toggle-btn[data-lang="' + lang + '"]');
      if (btn) btn.classList.toggle('active', _wnHide[gid][lang]);
    }

    // ── 오답노트 개별 단어 보기 ──
    function wnRevealWord(el) {
      if (!el.classList.contains('wn-blurred')) return;
      el.classList.toggle('wn-revealed');
    }

    function applyTheme(theme, accent) {
      // 다크/라이트
      document.body.classList.toggle('theme-light', theme === 'light');
      // 강조색 CSS 변수 적용
      const r = parseInt(accent.slice(1, 3), 16);
      const g = parseInt(accent.slice(3, 5), 16);
      const b = parseInt(accent.slice(5, 7), 16);
      // 밝기 계산 (라이트 테마에서 accent2 자동 조정)
      document.documentElement.style.setProperty('--accent', accent);
      // accent 관련 rgba 값들도 동적으로 적용
      document.documentElement.style.setProperty('--accent-rgb', `${r},${g},${b}`);
      S.theme = theme;
      S.accentColor = accent;
      localStorage.setItem('ydmaster_theme', theme);
      localStorage.setItem('ydmaster_accent', accent);
    }

    // 소셜 로그인 콜백 공통 처리
    async function handleSocialCallback(tokenKey, errorKey) {
      const params = new URLSearchParams(window.location.search);
      const token = params.get(tokenKey);
      const error = params.get(errorKey);

      if (error) {
        window.history.replaceState({}, '', window.location.pathname);
        toast(decodeURIComponent(error), 'error');
        return false;
      }

      if (token) {
        window.history.replaceState({}, '', window.location.pathname);
        S.token = token;
        localStorage.setItem('ydmaster_token', token);
        try {
          const d = await apiFetch('GET', '/auth/me');
          S.user = d.user;
          S.isAdmin = d.user.isAdmin || false;
          S.profile.avatarImage = d.user.avatarImage || '';
          S.profile.bannerImage = d.user.bannerImage || '';
          S.profile.banner = d.user.bannerGradient || 'linear-gradient(135deg,#6c63ff,#ff6584)';
          toast(`반갑습니다, ${d.user.username}님! 🎉`, 'success');
          await loadData();
          renderPage('home');
          return true;
        } catch (e) {
          S.token = null;
          localStorage.removeItem('ydmaster_token');
          toast('로그인 처리 중 오류가 발생했습니다.', 'error');
          return false;
        }
      }
      return false;
    }

      return await handleSocialCallback('naver_token', 'naver_error');
    }

    /* ============================================================

    ============================================================ */
    (function initPWA() {
      // ── Service Worker 등록 (/sw.js 를 백엔드에서 서빙) ──
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW 등록 실패:', err.message));
      }
    })();

    // ── 3. 설치 배너 ──
    let _pwaPrompt = null;
    let _pwaBannerShown = false;

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      _pwaPrompt = e;
      if (!_pwaBannerShown && !localStorage.getItem('pwa_dismissed')) {
        setTimeout(showPWABanner, 3000); // 3초 뒤 자연스럽게 노출
      }
    });

    window.addEventListener('appinstalled', () => {
      hidePWABanner();
      toast('✅ 앱이 설치되었습니다!', 'success');
      _pwaPrompt = null;
    });

    function showPWABanner() {
      if (_pwaBannerShown || !_pwaPrompt) return;
      _pwaBannerShown = true;
      const banner = document.createElement('div');
      banner.id = 'pwa-banner';
      banner.className = 'pwa-banner';
      banner.innerHTML = `
    <div class="pwa-banner-icon">📚</div>
    <div class="pwa-banner-text">
      <div class="pwa-banner-title">영단마스터 앱 설치</div>
      <div class="pwa-banner-sub">홈 화면에 추가하면 더 빠르게 열 수 있어요</div>
    </div>
    <div class="pwa-banner-actions">
      <button class="btn ghost sm" onclick="dismissPWABanner()" style="white-space:nowrap">나중에</button>
      <button class="btn primary sm" onclick="installPWA()" style="white-space:nowrap">설치</button>
    </div>
  `;
      document.body.appendChild(banner);
    }

    function hidePWABanner() {
      const b = document.getElementById('pwa-banner');
      if (b) { b.style.animation = 'none'; b.style.opacity = '0'; b.style.transform = 'translateY(20px)'; b.style.transition = 'all .3s'; setTimeout(() => b.remove(), 320); }
      _pwaBannerShown = false;
    }

    function dismissPWABanner() {
      hidePWABanner();
      localStorage.setItem('pwa_dismissed', '1');
    }

    async function installPWA() {
      if (!_pwaPrompt) { toast('이미 설치되어 있거나 이 브라우저는 설치를 지원하지 않아요.', 'info'); return; }
      hidePWABanner();
      _pwaPrompt.prompt();
      const { outcome } = await _pwaPrompt.userChoice;
      if (outcome === 'accepted') toast('✅ 설치를 시작합니다!', 'success');
      _pwaPrompt = null;
    }

    // 프로필 메뉴에서 수동으로 설치 배너 띄우기
    function showInstallPrompt() {
      if (_pwaPrompt) {
        _pwaBannerShown = false;
        localStorage.removeItem('pwa_dismissed');
        showPWABanner();
      } else {
        toast('이미 설치되어 있거나 크롬/엣지에서 지원됩니다.', 'info');
      }
    }

    // ── 브라우저 뒤로가기/앞으로가기 지원 ──
    window.addEventListener('popstate', e => {
      if (e.state && e.state.page) {
        const app = document.getElementById('app');
        if (app) {
          app.innerHTML = '';
          if (!S.user && e.state.page !== 'auth' && e.state.page !== 'landing' && e.state.page !== 'userprofile') { buildLanding(app); return; }
          switch (e.state.page) {
            case 'auth': buildAuth(app); break;
            case 'landing': buildLanding(app); break;
            case 'home': buildHome(app); break;
            case 'editor': buildEditorEntry(app); break;
            case 'test': buildTest(app); break;
            case 'result': buildResult(app); break;
            case 'history': buildHistory(app); break;
            case 'friends': buildFriends(app); break;
            case 'profile': buildProfile(app); break;
            case 'notice': buildNotice(app); break;
            case 'inquiry': buildInquiry(app); break;
            case 'admin': buildAdmin(app); break;
            case 'ranking': buildRanking(app); break;
            case 'wrongnote': buildWrongNote(app); break;
            case 'tests': buildAllTests(app, e.state.opts || {}); break;
            case 'favorites': buildAllTests(app, { tab: 'fav' }); break;
            case 'userprofile': buildPublicProfile(app, e.state.opts?.id); break;
            default: buildHome(app);
          }
        }
      }
    });

    async function init() {
      window.scrollTo(0, 1);
      // 저장된 테마 복원
      applyTheme(S.theme, S.accentColor);
      // /privacy 경로 처리
      if (window.location.pathname === '/privacy' || window.location.search.includes('page=privacy')) {
        document.getElementById('loading').style.display = 'none';
        buildPrivacyPage(document.getElementById('app'));
        return;
      }
      // 소셜 로그인 콜백 처리 (네이버 / 구글)
      const naverHandled = await handleNaverCallback();
      if (naverHandled) { document.getElementById('loading').style.display = 'none'; return; }
      const googleHandled = await handleGoogleCallback();
      if (googleHandled) { document.getElementById('loading').style.display = 'none'; return; }
      if (S.token) {
        try {
          const d = await apiFetch('GET', '/auth/me');
          S.user = d.user;
          S.isAdmin = d.user.isAdmin || false;
          S.profile.avatarImage = d.user.avatarImage || '';
          S.profile.bannerImage = d.user.bannerImage || '';
          S.profile.banner = d.user.bannerGradient || 'linear-gradient(135deg,#6c63ff,#ff6584)';
          S.favoriteIds = new Set(d.user.favorites || []);
          await loadData();
          // 해시 URL에서 초기 페이지 결정
          const hash = window.location.hash.replace('#/', '').split('/');
          if (hash[0] === 'profile' && hash[1]) {
            renderPage('userprofile', { id: decodeURIComponent(hash[1]) });
          } else {
            const startPage = hash[0] && ['home', 'tests', 'editor', 'friends', 'history', 'profile', 'ranking', 'wrongnote', 'notice', 'inquiry', 'admin'].includes(hash[0]) ? hash[0] : 'home';
            renderPage(startPage);
          }
        } catch (e) {
          S.token = null; localStorage.removeItem('ydmaster_token'); renderPage('auth');
        }
      } else {
        const hash = window.location.hash.replace('#/', '').split('/');
        if (hash[0] === 'profile' && hash[1]) {
          renderPage('userprofile', { id: decodeURIComponent(hash[1]) });
        } else { renderPage('landing'); }
      }
      document.getElementById('loading').style.display = 'none';
    }
    init();
  </script>
</body>

</html>
