    /* Landing sections shared */
    .landing-section {
      padding: 48px 20px;
      max-width: 800px;
      margin: 0 auto
    }

    .landing-section-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text)
    }

    .landing-section-sub {
      text-align: center;
      font-size: .88rem;
      color: var(--text3);
      margin-bottom: 28px
    }

    /* Features grid */
    .landing-feats-section {
      padding: 48px 20px;
      max-width: 800px;
      margin: 0 auto
    }

    .landing-features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%
    }

    .landing-feat {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color .15s, transform .15s
    }

    .landing-feat-icon {
      font-size: 1.3rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: rgba(108, 99, 255, .1);
      border-radius: 10px
    }

    .landing-feat-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: .9rem;
      margin-bottom: 4px;
      color: var(--text)
    }

    .landing-feat-desc {
      font-size: .8rem;
      color: var(--text3);
      line-height: 1.5
    }

    /* Review carousel */
    .landing-reviews {
      padding: 48px 0;
      overflow: hidden
    }

    .landing-reviews-track {
      display: flex;
      gap: 16px;
      animation: scrollReviews 24s linear infinite;
      width: max-content
    }

    .landing-reviews-track:hover {
      animation-play-state: paused
    }

    .review-card {
      flex-shrink: 0;
      width: 280px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative
    }

    .review-stars {
      color: #fbbf24;
      font-size: .85rem;
      margin-bottom: 8px;
      letter-spacing: 1px
    }

    .review-text {
      font-size: .88rem;
      color: var(--text2);
      line-height: 1.65;
      margin-bottom: 12px
    }

    .review-author {
      font-size: .78rem;
      color: var(--text3);
      font-weight: 600
    }

    @keyframes scrollReviews {
      0% {
        transform: translateX(0)
      }

      100% {
        transform: translateX(-50%)
      }
    }

    /* Scroll animations */
    .landing-anim {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity .6s ease-out, transform .6s ease-out
    }

    .landing-anim.visible {
      opacity: 1;
      transform: translateY(0)
    }

    /* Sticky header */
    .landing-sticky{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;transform:translateY(-100%);transition:transform .3s ease;pointer-events:none}
    .landing-sticky.show{transform:translateY(0);pointer-events:auto}
    .landing-sticky-logo{display:flex;align-items:center;gap:8px;font-family:'Syne',sans-serif;font-weight:800;font-size:1.05rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

    .landing-sticky .btn{padding:8px 22px;font-size:.85rem;min-width:auto}
    body.theme-light .landing-sticky{background:rgba(255,255,255,.88)}

    /* FAQ section */
    .landing-faq{padding:48px 20px;max-width:800px;margin:0 auto}
    .faq-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
    .faq-q{padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:.92rem;color:var(--text);transition:color .15s}
    .faq-q:hover{color:var(--accent)}
    .faq-q svg{flex-shrink:0;width:18px;height:18px;transition:transform .25s;color:var(--text3)}
    .faq-item.open .faq-q svg{transform:rotate(180deg)}
    .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
    .faq-a-inner{padding:0 18px 16px;font-size:.86rem;color:var(--text2);line-height:1.7}
    body.theme-light .faq-item{background:#fff;border-color:#dcdce8}

    .landing-footer {
      position: relative;
      z-index: 1;
      padding: 44px 20px 28px;
      background: var(--bg2);
      font-size: .78rem;
      color: var(--text3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px
    }

    .landing-footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent))
    }

    .landing-footer-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 800px
    }

    .landing-footer-top{display:flex;align-items:center;gap:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;color:var(--text);letter-spacing:-.01em}

    .landing-footer-desc{font-size:.82rem;color:var(--text3);text-align:center;line-height:1.7;max-width:420px}

    .landing-footer-social{display:flex;gap:10px}
    .landing-footer-social a{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);text-decoration:none;transition:all .2s ease}
    .landing-footer-social a:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-2px);box-shadow:0 4px 12px rgba(108,99,255,.3)}

    .landing-footer-brand{display:flex;flex-direction:column;align-items:center;gap:8px}
    .landing-footer-right{display:flex;flex-direction:column;align-items:center;gap:16px}

    .landing-footer-nav{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
    .landing-footer-nav a{color:var(--text2);text-decoration:none;font-size:.82rem;transition:color .15s;position:relative}
    .landing-footer-nav a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--accent);transition:width .2s ease}
    .landing-footer-nav a:hover{color:var(--accent)}
    .landing-footer-nav a:hover::after{width:100%}

    .landing-footer-bottom{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:20px;border-top:1px solid var(--border);width:100%;max-width:800px}

    .landing-footer-copy{font-size:.72rem;color:var(--text3);opacity:.7}

    .landing-footer a {
      color: var(--text3);
      text-decoration: none
    }

    /* ── 공지사항 / 문의 / 관리자 ── */
    .notice-item {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .15s
    }

    .notice-item:hover {
      border-color: rgba(var(--accent-rgb), .4)
    }

    .notice-pin {
      display: inline-block;
      background: rgba(var(--accent-rgb), .12);
      color: var(--accent);
      font-size: .7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 100px;
      margin-bottom: 6px
    }

    .notice-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: .95rem;
      margin-bottom: 4px
    }

    .notice-meta {
      font-size: .75rem;
      color: var(--text3)
    }

    .notice-content {
      font-size: .88rem;
      color: var(--text2);
      line-height: 1.7;
      margin-top: 12px;
      white-space: pre-wrap
    }

    .inquiry-item {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: border-color .15s
    }

    .inquiry-item:hover {
      border-color: rgba(108,99,255,.2)
    }

    .inq-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px
    }

    .inquiry-status {
      display: inline-flex;
      align-items: center;
      font-size: .68rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 100px
    }

    .inquiry-status.pending {
      background: rgba(255, 209, 102, .12);
      color: var(--accent4)
    }

    .inquiry-status.answered {
      background: rgba(67, 233, 123, .12);
      color: var(--accent3)
    }

    .inquiry-title {
      font-weight: 700;
      font-size: .92rem;
      margin-bottom: 4px;
      color: var(--text)
    }

    .inquiry-content {
      font-size: .82rem;
      color: var(--text2);
      line-height: 1.6;
      margin-top: 4px;
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .inq-item-meta {
      font-size: .7rem;
      color: var(--text3);
      margin-top: 8px
    }

    .inquiry-answer {
      display: flex;
      align-items: baseline;
      gap: 8px;
      background: rgba(108,99,255,.05);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: .82rem;
      color: var(--text);
      line-height: 1.6
    }

    .inquiry-answer-label {
      font-size: .7rem;
      font-weight: 700;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0
    }

    .inquiry-answer-text {
      white-space: pre-wrap;
      word-break: break-word
    }

    .inquiry-answer-date {
      font-size: .68rem;
      color: var(--text3);
      margin-top: 6px;
      text-align: right
    }

    .inq-like-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      padding: 4px 10px;
      font-size: .72rem;
      color: var(--text3);
      cursor: pointer;
      transition: all .15s;
      font-weight: 600
    }

    .inq-like-btn:hover {
      border-color: var(--accent2);
      color: var(--accent2)
    }

    .inq-like-btn.active {
      background: rgba(255,101,132,.1);
      border-color: rgba(255,101,132,.3);
      color: var(--accent2)
    }

    .inq-like-btn.active svg {
      fill: var(--accent2)
    }

    .inq-tabs-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      padding: 0 2px
    }

    .inq-tab {
      font-size: .78rem;
      font-weight: 600;
      color: var(--text3);
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 100px;
      transition: all .15s
    }

    .inq-tab:hover {
      color: var(--text2)
    }

    .inq-tab.active {
      background: var(--accent);
      color: #fff
    }

    .inq-sort-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: .72rem;
      color: var(--text3);
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 8px;
      transition: all .15s;
      border: 1px solid var(--border)
    }

    .inq-sort-btn:hover {
      color: var(--accent);
      border-color: var(--accent)
    }

    .admin-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px
    }

    .admin-stat {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center
    }

    .admin-stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent)
    }

    .admin-stat-label {
      font-size: .73rem;
      color: var(--text3);
      margin-top: 3px
    }

    .admin-tabs {
      display: flex;
      background: var(--bg3);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 18px;
      gap: 4px;
      overflow-x: auto
    }

    .admin-tab {
      flex: 1;
      padding: 9px 12px;
      text-align: center;
      border-radius: 9px;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 500;
      color: var(--text3);
      transition: all .2s;
      white-space: nowrap;
      user-select: none
    }

    .admin-tab.active {
      background: var(--accent);
      color: white
    }

    .user-row {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px
    }

    .user-row-info {
      flex: 1;
      min-width: 0
    }

    .user-row-name {
      font-weight: 600;
      font-size: .9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .user-row-email {
      font-size: .75rem;
      color: var(--text3)
    }

    .admin-badge {
      display: inline-block;
      background: rgba(var(--accent-rgb), .12);
      color: var(--accent);
      font-size: .65rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 100px;
      margin-left: 6px
    }

    /* ── 상단 보조 네비 (공지 / 문의) ── */
    .top-subnav {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 12px;
      height: 34px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0
    }

    .top-subnav::-webkit-scrollbar {
      display: none
    }

    .subnav-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: .74rem;
      font-weight: 600;
      color: var(--text3);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
      border: none;
      background: none
    }

    .subnav-btn:hover {
      color: var(--accent);
      background: rgba(var(--accent-rgb), .1)
    }

    .subnav-btn.active {
      color: var(--accent);
      background: rgba(var(--accent-rgb), .12)
    }

    .subnav-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0
    }

    .subnav-divider {
      width: 1px;
      height: 14px;
      background: var(--border);
      flex-shrink: 0;
      margin: 0 2px
    }

    body.theme-light .top-subnav {
      background: #eaeaf0;
      border-color: #dcdce8
    }

    body.theme-light .subnav-btn {
      color: #8888a0
    }

    body.theme-light .subnav-btn:hover,
    body.theme-light .subnav-btn.active {
      color: var(--accent);
      background: rgba(var(--accent-rgb), .1)
    }

    /* ── 관리자 버튼 정사각형 ── */
    .admin-sq-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: rgba(var(--accent-rgb), .12);
      border: 1px solid rgba(var(--accent-rgb), .25);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: .9rem;
      flex-shrink: 0;
      transition: all .15s
    }

    .admin-sq-btn:hover {
      background: rgba(var(--accent-rgb), .22)
    }

    body.theme-light .admin-sq-btn {
      background: rgba(var(--accent-rgb), .08);
      border-color: rgba(var(--accent-rgb), .2)
    }

    /* ── 관리자 통계 차트 ── */
    .admin-chart-section {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 18px
    }

    .admin-chart-title {
      font-size: .82rem;
      font-weight: 700;
      color: var(--text2);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 7px
    }

    /* chart-box: canvas의 부모. overflow:hidden으로 크기 탈출 차단 */
    .admin-chart-box {
      position: relative;
      width: 100%;
      overflow: hidden
    }

    .admin-chart-box canvas {
      display: block;
      width: 100% !important
    }

    .admin-period-row {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .admin-period-btn {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: .73rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      cursor: pointer;
      transition: all .15s
    }

    .admin-period-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent)
    }

    body.theme-light .admin-chart-section {
      background: #fff;
      border-color: #dcdce8
    }

    body.theme-light .admin-period-btn {
      background: #f4f4f8;
      border-color: #dcdce8;
      color: #44445a
    }

    /* ── 관리자 로그 뷰어 ── */
    .log-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center
    }

    .log-search {
      flex: 1;
      min-width: 120px;
      padding: 7px 12px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-size: .8rem;
      font-family: inherit
    }

    .log-search:focus {
      outline: none;
      border-color: var(--accent)
    }

    .log-filter-btns {
      display: flex;
      gap: 5px;
      flex-wrap: wrap
    }

    .log-filter-btn {
      padding: 5px 11px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap
    }

    .log-filter-btn.active {
      color: white;
      border-color: currentColor
    }

    .log-filter-btn.all.active {
      background: #6c63ff;
      border-color: #6c63ff
    }

    .log-filter-btn.info.active {
      background: #43e97b;
      border-color: #43e97b;
      color: #0a0a0f
    }

    .log-filter-btn.http.active {
      background: #06b6d4;
      border-color: #06b6d4
    }

    .log-filter-btn.warn.active {
      background: #ffd166;
      border-color: #ffd166;
      color: #0a0a0f
    }

    .log-filter-btn.error.active {
      background: #ff6584;
      border-color: #ff6584
    }

    .log-action-btns {
      display: flex;
      gap: 6px;
      margin-left: auto
    }

    .log-container {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace
    }

    .log-header-row {
      display: grid;
      grid-template-columns: 160px 48px 1fr;
      gap: 0;
      padding: 8px 14px;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      font-size: .68rem;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .log-list {
      max-height: 460px;
      overflow-y: auto;
      scrollbar-width: thin
    }

    .log-item {
      display: grid;
      grid-template-columns: 160px 48px 1fr;
      gap: 0;
      padding: 6px 14px;
      border-bottom: 1px solid rgba(42, 42, 56, .3);
      font-size: .73rem;
      line-height: 1.5;
      transition: background .1s
    }

    .log-item:hover {
      background: rgba(var(--accent-rgb), .04)
    }

    .log-item:last-child {
      border-bottom: none
    }

    .log-ts {
      color: var(--text3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 8px
    }

    .log-level {
      font-weight: 700;
      text-align: center;
      padding: 0 4px;
      border-radius: 4px;
      font-size: .65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      height: fit-content;
      margin: auto 0
    }

    .log-level.info {
      color: #43e97b
    }

    .log-level.http {
      color: #06b6d4
    }

    .log-level.warn {
      color: #ffd166
    }

    .log-level.error {
      color: #ff6584
    }

    .log-msg {
      color: var(--text2);
      word-break: break-all;
      padding-left: 10px
    }

    .log-item.error-row {
      background: rgba(255, 101, 132, .04)
    }

    .log-item.warn-row {
      background: rgba(255, 209, 102, .03)
    }

    .log-empty {
      text-align: center;
      padding: 36px;
      color: var(--text3);
      font-size: .82rem
    }

    body.theme-light .log-container {
      background: #ffffff;
      border-color: #dcdce8
    }

    body.theme-light .log-header-row {
      background: #f4f4f8;
      border-color: #dcdce8
    }

    body.theme-light .log-item {
      border-color: #eaeaf0
    }

    body.theme-light .log-item:hover {
      background: rgba(var(--accent-rgb), .03)
    }

    body.theme-light .log-item.error-row {
      background: rgba(255, 101, 132, .03)
    }

    body.theme-light .log-item.warn-row {
      background: rgba(255, 209, 102, .02)
    }

    body.theme-light .log-msg {
      color: #44445a
    }

    body.theme-light .log-ts {
      color: #8888a0
    }

    body.theme-light .log-search {
      background: #f4f4f8;
      border-color: #dcdce8;
      color: #111120
    }

    @media(max-width:600px) {

      .log-header-row,
      .log-item {
        grid-template-columns: 110px 40px 1fr
      }

      .log-ts {
        font-size: .65rem
      }

      .log-msg {
        font-size: .7rem;
        padding-left: 6px
      }

      .admin-chart-canvas {
        min-height: 160px
      }
    }

    /* ── 타 유저 프로필 모달 ── */
    .upm-banner {
      height: 88px;
      position: relative;
      border-radius: var(--radius) var(--radius) 0 0;
      overflow: hidden
    }

    .upm-avatar-row {
      display: flex;
      align-items: flex-end;

      background: linear-gradient(135deg, var(--accent), var(--accent2));

      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0
    }

    .pwa-banner-text {
      flex: 1;
      min-width: 0
    }

    .pwa-banner-title {
      font-weight: 700;
      font-size: .88rem;
      color: var(--text);
      margin-bottom: 2px
    }

    .pwa-banner-sub {
      font-size: .74rem;
      color: var(--text3);
      line-height: 1.4
    }

    .pwa-banner-actions {
      display: flex;
      gap: 7px;
      flex-shrink: 0
    }

    @media(min-width:768px) {
      .pwa-banner {
        bottom: 24px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        min-width: 360px
      }
    }

    body.theme-light .pwa-banner {
      background: #fff;
      border-color: #dcdce8;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .12)
    }

    /* ── 결과 화면 차트 / 오답 필터 ── */
    .result-filter-row {
      display: flex;
      gap: 8px;
      padding: 0 16px;
      margin-bottom: 16px
    }

    .result-filter-btn {
      flex: 1;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: .8rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text2);
      cursor: pointer;
      transition: all .15s;
      text-align: center
    }

    .result-filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent)
    }

    /* 결과 화면 — 2열 레이아웃 (데스크탑) */
    .result-body-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 0 16px;
      margin-bottom: 20px;
      align-items: start
    }

    .result-left-col {}

    .result-right-col {}

    @media(max-width:700px) {
      .result-body-grid {
        grid-template-columns: 1fr;
        gap: 0;
        padding: 0
      }

      .result-left-col {
        order: 2
      }

      .result-right-col {
        order: 1;
        margin-bottom: 12px
      }
    }

    /* 차트 */
    .chart-section {
      margin-bottom: 20px
    }

    .chart-section.in-grid {
      margin-bottom: 0
    }

    .chart-title {
      font-size: .85rem;
      font-weight: 700;
      color: var(--text2);
      margin-bottom: 10px
    }

    .chart-wrap {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: relative
    }

    .chart-wrap canvas {
      width: 100% !important;
      max-height: none !important
    }

    .chart-canvas-tall {
      min-height: 300px
    }

    @media(min-width:701px) {
      .chart-canvas-tall {
        min-height: 380px
      }
    }

    /* ── 랭킹 페이지 ── */
    .rank-page-wrap {
      padding: 24px 16px;
      padding-bottom: calc(var(--bnav-h) + var(--sab) + 24px)
    }

    .rank-podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      padding: 0 8px
    }

    .rank-podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 120px
    }

    .rank-podium-item.first { order: 2 }
    .rank-podium-item.second { order: 1 }
    .rank-podium-item.third { order: 3 }

    .rank-crown {
      font-size: 1.5rem;
      margin-bottom: 6px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.15))
    }

    .rank-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: white;
      margin-bottom: 8px;
      position: relative;
      box-shadow: 0 4px 12px rgba(0,0,0,.15)
    }

    .rank-avatar.first {
      width: 68px;
      height: 68px;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      box-shadow: 0 4px 20px rgba(255,215,0,.4)
    }

    .rank-avatar.second {
      background: linear-gradient(135deg, #c0c8d0, #8a9bab);
      box-shadow: 0 4px 16px rgba(176,190,197,.35)
    }

    .rank-avatar.third {
      background: linear-gradient(135deg, #d4944c, #a05a2c);
      box-shadow: 0 4px 16px rgba(205,127,50,.3)
    }

    .rank-podium-name {
      font-size: .78rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .rank-podium-pct {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: .82rem;
      margin-top: 3px
    }

    .rank-podium-bar {
      width: 100%;
      border-radius: 14px 14px 0 0;
      margin-top: 10px;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10px
    }

    .rank-podium-bar .rank-place {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      opacity: .5
    }

    .rank-podium-bar.first {
      height: 90px;
      background: linear-gradient(180deg, rgba(255,215,0,.25) 0%, rgba(255,170,0,.08) 100%);
      border: 2px solid rgba(255,215,0,.35);
      border-bottom: none
    }
    .rank-podium-bar.first .rank-place { color: #ffa500 }

    .rank-podium-bar.second {
      height: 65px;
      background: linear-gradient(180deg, rgba(176,190,197,.2) 0%, rgba(176,190,197,.06) 100%);
      border: 2px solid rgba(176,190,197,.3);
      border-bottom: none
    }
    .rank-podium-bar.second .rank-place { color: #8a9bab }

    .rank-podium-bar.third {
      height: 48px;
      background: linear-gradient(180deg, rgba(205,127,50,.2) 0%, rgba(205,127,50,.06) 100%);
      border: 2px solid rgba(205,127,50,.3);
      border-bottom: none
    }
    .rank-podium-bar.third .rank-place { color: #a05a2c }

    /* white theme podium improvements */
    body.theme-light .rank-podium-bar.first {
      background: linear-gradient(180deg, rgba(255,215,0,.18) 0%, rgba(255,215,0,.05) 100%);
      border-color: rgba(255,170,0,.3)
    }
    body.theme-light .rank-podium-bar.second {
      background: linear-gradient(180deg, rgba(120,144,156,.12) 0%, rgba(120,144,156,.04) 100%);
      border-color: rgba(120,144,156,.25)
    }
    body.theme-light .rank-podium-bar.third {
      background: linear-gradient(180deg, rgba(205,127,50,.12) 0%, rgba(205,127,50,.04) 100%);
      border-color: rgba(180,110,40,.25)
    }
    body.theme-light .rank-avatar.first { box-shadow: 0 4px 16px rgba(255,170,0,.3) }
    body.theme-light .rank-avatar.second { box-shadow: 0 4px 12px rgba(120,144,156,.25) }
    body.theme-light .rank-avatar.third { box-shadow: 0 4px 12px rgba(180,110,40,.2) }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px
    }

    .rank-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px
    }

    .rank-item.rank-me {
      border-color: var(--accent);
      background: rgba(var(--accent-rgb), .06)
    }

    .rank-num {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: .95rem;
      color: var(--text3);
      width: 24px;
      text-align: center;
      flex-shrink: 0
    }

    .rank-item-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: .85rem;
      color: white;
      flex-shrink: 0
    }

    .rank-item-info {
      flex: 1;
      min-width: 0
    }

    .rank-item-name {
      font-size: .88rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .rank-item-sub {
      font-size: .72rem;
      color: var(--text3);
      margin-top: 2px
    }

    .rank-item-score {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      flex-shrink: 0
    }

    .rank-my-bar {
      background: rgba(var(--accent-rgb), .08);
      border: 1.5px solid rgba(var(--accent-rgb), .3);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-top: 8px
    }

    .rank-my-label {
      font-size: .72rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px
    }

    .rank-my-row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .rank-loading {
      text-align: center;
      padding: 40px 0;
      color: var(--text3);
      font-size: .88rem
    }

    .rank-tabs {
      display: flex;
      background: var(--bg3);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px
    }

    .rank-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      border-radius: 9px;
      cursor: pointer;
      font-size: .82rem;
      font-weight: 500;
      color: var(--text3);
      transition: all .2s;
      user-select: none
    }

    .rank-tab.active {
      background: var(--accent);
      color: white
    }

    /* ── 주관식 문항 ── */
    .subj-input-wrap {
      margin-top: 8px
    }

    .subj-input {
      width: 100%;
      padding: 16px 18px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      font-size: 1.05rem;
      font-family: 'Noto Sans KR', sans-serif;
      outline: none;
      transition: border-color .2s;
      text-align: center;
      letter-spacing: 1px
    }

    .subj-input:focus {
      border-color: var(--accent)
    }

    .subj-input.correct {
      border-color: var(--accent3);
      background: rgba(67, 233, 123, .08);
      color: var(--accent3)
    }

    .subj-input.wrong {
      border-color: var(--accent2);
      background: rgba(255, 101, 132, .08);
      color: var(--accent2)
    }

    .subj-submit {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 13px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s;
      font-family: 'Noto Sans KR', sans-serif
    }

    .subj-submit:hover {
      filter: brightness(1.15)
    }

    .subj-submit:disabled {
      opacity: .5;
      cursor: default
    }

    .q-type-badge.subj {
      background: rgba(255, 209, 102, .12);
      color: var(--accent4)
    }

    /* ── 인증 코드 입력 ── */
    .verify-sent-wrap {
      text-align: center;
      padding: 10px 0
    }

    .verify-sent-emoji {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block
    }

    .verify-sent-title {
      font-weight: 800;
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: var(--text)
    }

    .verify-sent-email {
      display: inline-block;
      background: rgba(var(--accent-rgb), .1);
      border: 1px solid rgba(var(--accent-rgb), .25);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 12px
    }

    .verify-sent-desc {
      color: var(--text2);
      font-size: .85rem;
      line-height: 1.7
    }

    /* ════════════════════════════════════
   UI/UX 개선 — 전역 강화
════════════════════════════════════ */

    /* 부드러운 페이지 전환 */
    .page {
      animation: pageIn .22s cubic-bezier(.22, 1, .36, 1)
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* 카드 호버 효과 */
    .test-card,
    .stat-card,
    .bk-item,
    .h-item,
    .friend-item,
    .rank-item {
      transition: transform .18s cubic-bezier(.22, 1, .36, 1), box-shadow .18s, border-color .18s;
    }

    .test-card:hover,
    .stat-card:hover,
    .bk-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(108, 99, 255, .15);
      border-color: rgba(108, 99, 255, .35);
    }

    /* 버튼 향상 */
    .btn {
      position: relative;
      overflow: hidden;
      transition: filter .15s, transform .12s, box-shadow .15s;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      box-shadow: 0 4px 16px rgba(108, 99, 255, .35);
    }

    .btn.primary:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(108, 99, 255, .45)
    }

    .btn.primary:active {
      transform: translateY(0);
      filter: brightness(.96)
    }

    .btn.ghost {
      border: 1.5px solid var(--border);
      color: var(--text2)
    }

    .btn.ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(var(--accent-rgb), .07)
    }

    /* 상단 nav 개선 */
    .top-nav {
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, .05);
    }

    /* 하단 nav 개선 */
    .bottom-nav {
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px)
    }

    .bn-item.active svg {
      stroke: var(--accent)
    }

    .bn-item.active .bn-label {
      color: var(--accent);
      font-weight: 700
    }

    .bn-item {
      transition: transform .15s
    }

    .bn-item:active {
      transform: scale(.9)
    }

    /* 인증 카드 강화 */
    .auth-card {
      background: rgba(28, 28, 37, .9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .5), 0 0 0 1px rgba(108, 99, 255, .1);
    }

    body.theme-light .auth-card {
      background: rgba(255, 255, 255, .95);
      border: 1px solid rgba(108, 99, 255, .12);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .12), 0 0 0 1px rgba(108, 99, 255, .08);
    }

    .auth-logo h1 {
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      box-shadow: 0 2px 12px rgba(108, 99, 255, .4);
    }

    /* 소셜 로그인 버튼 */
    .social-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: .9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: filter .15s, transform .12s, box-shadow .15s;
      border: none;
    }

    .social-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px)
    }

    .social-btn:active {
      transform: translateY(0)
    }

    /* 로딩 화면 배경만 개선 (폰트는 원본 유지) */
    #loading {
      background: linear-gradient(135deg, #0a0a0f 0%, #111118 100%);
    }

    /* 통계 카드 그라디언트 */
    .stat-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(108, 99, 255, .12), transparent 70%);
      pointer-events: none;
    }

    /* 셀 에디터 드래그 힌트 */
    .ss-row-num {
      cursor: row-resize;
      user-select: none;
      transition: background .1s
    }

    .ss-row.selected {
      background: rgba(var(--accent-rgb), .07) !important
    }

    body.theme-light .ss-row.selected {
      background: rgba(108, 99, 255, .06) !important
    }

    /* 테스트 카드 배지 */
    .test-card {
      position: relative
    }

    /* 모바일 최적화 (≤600px) */
    @media(max-width:600px) {
      .landing-hero-section {
        padding: 40px 20px 20px;
        min-height: 75dvh
      }

      .landing-logo {
        font-size: 2rem
      }

      .landing-sub {
        font-size: .92rem;
        margin-bottom: 20px
      }

      .landing-btns .btn {
        width: 100%;
        text-align: center
      }

      .landing-feats-section {
        padding: 36px 16px
      }

      .landing-features {
        grid-template-columns: 1fr;
        gap: 10px
      }

      .landing-section {
        padding: 36px 16px
      }

      .landing-reviews {
        padding: 36px 0
      }

      .review-card {
        width: 240px
      }

      .landing-faq {
        padding: 36px 16px
      }

        align-items: flex-end;
        padding: 0
      }

      }

    @keyframes slideUp {

      }

      }
    }

    @media(min-width:601px) and (max-width:767px) {
      .landing-hero-section {
        padding: 60px 28px 30px;
        min-height: 80dvh
      }

      .landing-features {
        grid-template-columns: 1fr 1fr;
        gap: 10px
      }

      .landing-feats-section {
        padding: 40px 28px
      }

      .auth-card {
        max-width: 440px;
        padding: 32px 28px
      }

    /* PC 최적화 (≥768px) */
    @media(min-width:768px) {
      .landing-hero-section {
        min-height: 90dvh;
        padding: 80px 40px 40px
      }

      .landing-logo {
        font-size: 2.8rem
      }

      .landing-sub {
        font-size: 1.1rem;
        margin-bottom: 24px;
        max-width: 480px
      }

        justify-content: center
      }

      .landing-btns .btn {
        font-size: 1.05rem;

        padding: 56px 40px;

      }

        grid-template-columns: 1fr 1fr;
        gap: 14px
      }

      .landing-feat:hover {
        border-color: rgba(108, 99, 255, .4);
        transform: translateX(4px)
      }

        max-width: 960px;
        padding: 56px 40px
      }

      .landing-footer {
        padding: 52px 40px 32px
      }

      .landing-footer-inner {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
        max-width: 960px
      }

      .landing-footer-brand {
        align-items: flex-start
      }

      .landing-footer-desc {
        text-align: left
      }

      .landing-footer-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 16px
      }

      .landing-footer-bottom {
        max-width: 960px;
        flex-direction: row;
        justify-content: space-between
      }

      }

        max-width: 960px;
        padding: 56px 40px
      }

        border-radius: 24px;
        padding: 40px 36px
      }

      .auth-logo h1 {
        font-size: 2.6rem
      }

        font-size: .9rem;
        margin-top: 8px

    /* 대형 모니터 (≥1100px) */

      .landing-logo {
        font-size: 3.2rem
      }

      .landing-sub {
        font-size: 1.2rem;
        max-width: 520px

      user: null, token: localStorage.getItem('ydmaster_token') || null, isAdmin: false,

    /* ============================================================
       UTILS
    ============================================================ */
    const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

    function toast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast ${type}`; el.textContent = msg;
      document.getElementById('toast-wrap').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function showModal(html, center = false) {
      const ov = document.createElement('div');
      ov.className = 'modal-overlay' + (center ? ' center' : '');
      ov.innerHTML = `<div class="modal${center ? ' center-modal' : ''}">${html}</div>`;
      ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
      document.body.appendChild(ov);
      return ov;
    }
    function closeModal() { document.querySelector('.modal-overlay')?.remove(); }

    /* ============================================================
       API
    ============================================================ */
    async function apiFetch(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (S.token) opts.headers['Authorization'] = `Bearer ${S.token}`;
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(API + path, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || '오류가 발생했습니다.');
      return data;
    }

    /* ============================================================
       AUTH
    ============================================================ */
    async function register(username, email, password, phone) {
      const body = { username, password, agreedToTerms: true };
      if (phone) body.phone = phone; else body.email = email;
      const res = await apiFetch('POST', '/auth/register', body);
      if (res.verifyType === 'phone' && res.devCode) {
        toast(`인증 코드: ${res.devCode} (SMS 미설정 — 개발 모드)`, 'ok');
      }
      showCodeInput(phone || email, res.token);
    }

    function showCodeInput(contact, sessionToken) {
      const isPhone = /^01[016789]/.test(contact.replace(/[-\s]/g, ''));
      const c = document.getElementById('auth-form');
      if (!c) return;
      c.innerHTML = `
    <div class="verify-sent-wrap">
      <span class="verify-sent-emoji">${isPhone ? '📱' : '📨'}</span>
      <div class="verify-sent-title">인증 코드를 입력해주세요</div>
      <div class="verify-sent-email">${esc(contact)}</div>
      <div class="verify-sent-desc" style="margin-bottom:18px">${isPhone ? '위 전화번호로' : '위 이메일로'} 6자리 인증 코드를 발송했습니다.<br>코드는 <strong style="color:var(--accent)">10분</strong> 동안 유효합니다.</div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input type="text" class="form-input" id="verify-code-input"
          placeholder="6자리 코드 입력"
          maxlength="6" inputmode="numeric" pattern="[0-9]*"
          style="text-align:center;font-size:1.3rem;letter-spacing:8px;font-weight:700"
          onkeydown="if(event.key==='Enter')submitVerifyCode('${sessionToken.replace(/'/g, "\'")}')"/>
      </div>
      <button class="btn primary full" onclick="submitVerifyCode('${sessionToken.replace(/'/g, "\'")}')">인증 완료</button>
      <div style="display:flex;justify-content:space-between;margin-top:14px">
        <button class="btn ghost sm" onclick="resendCode('${sessionToken.replace(/'/g, "\'")}')">코드 재발송</button>
        <button class="btn ghost sm" onclick="switchTab('r')">다시 가입</button>
      </div>
    </div>`;
      setTimeout(() => document.getElementById('verify-code-input')?.focus(), 100);
    }

    async function submitVerifyCode(sessionToken) {
      const code = document.getElementById('verify-code-input')?.value?.trim();
      if (!code || code.length !== 6) { toast('6자리 코드를 입력해주세요.', 'error'); return; }
      const btn = document.querySelector('#auth-form .btn.primary');
      if (btn) { btn.disabled = true; btn.textContent = '확인 중...'; }
      try {
        const res = await apiFetch('POST', '/auth/verify-code', { token: sessionToken, code });
        // 인증 성공 → 바로 로그인
        S.token = res.token; S.user = res.user;
        S.isAdmin = res.user.isAdmin || false;
        localStorage.setItem('ydmaster_token', res.token);
        toast('환영합니다, ' + res.user.username + '님! 🎉', 'success');
        await loadData(); renderPage('home');
      } catch (e) {
        toast(e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = '인증 완료'; }
      }
    }

    async function resendCode(sessionToken) {
      const btn = document.querySelector('#auth-form .btn.ghost');
      if (btn) { btn.disabled = true; btn.textContent = '발송 중...'; }
      try {
        await apiFetch('POST', '/auth/resend-code', { token: sessionToken });
        toast('새 인증 코드를 발송했습니다. 메일함을 확인해주세요.', 'success');
        if (btn) { btn.disabled = false; btn.textContent = '코드 재발송'; }
        // 입력창 초기화
        const inp = document.getElementById('verify-code-input');
        if (inp) { inp.value = ''; inp.focus(); }
      } catch (e) {
        toast(e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = '코드 재발송'; }
      }
    }
    async function login(email, password) {
      const d = await apiFetch('POST', '/auth/login', { email, password });
      S.token = d.token; S.user = d.user; localStorage.setItem('ydmaster_token', d.token);
      toast(`반갑습니다, ${d.user.username}님!`, 'success');
      await loadData(); renderPage('home');
    }
    function logout() {
      S.token = null; S.user = null; localStorage.removeItem('ydmaster_token'); renderPage('auth');
    }

    /* ============================================================
       DATA LOADERS
    ============================================================ */
    async function loadData() {
      try {
        const [tests, myTests, history, stats, friends, reqs, notices, favorites] = await Promise.all([
          apiFetch('GET', '/tests'),
          apiFetch('GET', '/tests?mine=true'),
          apiFetch('GET', '/results'),
          apiFetch('GET', '/stats'),
          apiFetch('GET', '/friends'),
          apiFetch('GET', '/friends/requests'),
          fetch(API + '/notices').then(r => r.json()).catch(() => []),
          apiFetch('GET', '/favorites').catch(() => []),
        ]);
        S.tests = tests; S.myTests = myTests; S.history = history; S.stats = stats;
        S.friends = friends; S.friendRequests = reqs; S.notices = notices || [];
        S.favorites = (favorites || []);
        // favorites ID 셋 — 빠른 조회용
        S.favoriteIds = new Set((favorites || []).map(t => t._id || t));
      } catch (e) { console.error(e); }
    }

    /* ============================================================
       RENDER ENGINE
    ============================================================ */
    function renderPage(page, opts = {}) {
      S.page = page;
      // 해시 URL 업데이트 (SPA 라우팅)
      const newHash = page === 'userprofile' ? '#/profile/' + (opts.id || '') : '#/' + page + (opts.id ? '/' + opts.id : '');
      if (window.location.hash !== newHash) {
        window.history.pushState({ page, opts }, '', newHash);
      }
      const app = document.getElementById('app');
      app.innerHTML = '';
      if (!S.user && page !== 'auth' && page !== 'landing' && page !== 'userprofile') { buildLanding(app); return; }
      switch (page) {
        case 'auth': buildAuth(app); break;
        case 'landing': buildLanding(app); break;
        case 'home': buildHome(app); break;
        case 'editor': buildEditorEntry(app); break;
        case 'test': buildTest(app); break;
        case 'result': buildResult(app); break;
        case 'history': buildHistory(app); break;
        case 'friends': buildFriends(app); break;
        case 'profile': buildProfile(app); break;
        case 'notice': buildNotice(app); break;
        case 'inquiry': buildInquiry(app); break;
        case 'admin': buildAdmin(app); break;
        case 'ranking': buildRanking(app); break;
        case 'wrongnote': buildWrongNote(app); break;

        }, { threshold: 0.15 });
        animEls.forEach(function (el) { obs.observe(el); });

        scrollEl.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('scroll', onScroll, { passive: true });

    async function doRegister() {
      const agree = document.getElementById('r-agree');
      if (!agree?.checked) { toast('개인정보 수집·이용에 동의해주세요.', 'error'); return; }
      const nm = document.getElementById('r-nm')?.value?.trim();
      const contact = document.getElementById('r-em')?.value?.trim();
      const pw = document.getElementById('r-pw')?.value;
      if (!nm || !contact || !pw) { toast('모든 항목을 입력해주세요.', 'error'); return; }
      if (pw.length < 8) { toast('비밀번호는 8자 이상이어야 합니다.', 'error'); return; }
      if (!/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) { toast('비밀번호는 영문과 숫자를 포함해야 합니다.', 'error'); return; }
      const isPhone = /^01[016789]/.test(contact.replace(/[-\s]/g, ''));
      const btn = document.querySelector('#auth-form .btn.primary.full');
      if (btn) { btn.disabled = true; btn.textContent = '처리 중...'; }
      try {
        await register(nm, isPhone ? '' : contact, pw, isPhone ? contact : '');
      } catch (e) {
        toast(e.message || '오류가 발생했습니다.', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '회원가입'; }
      }
    }

    function showForgotPassword() {
      showModal(`

  `);
      setTimeout(() => document.getElementById('fp-email')?.focus(), 100);

    async function sendForgotCode() {
      const email = document.getElementById('fp-email')?.value?.trim();
      if (!email) { toast('이메일을 입력해주세요.', 'error'); return; }
      const btn = document.getElementById('fp-send-btn');
      if (btn) { btn.disabled = true; btn.textContent = '발송 중...'; }
      try {
        const res = await apiFetch('POST', '/auth/forgot-password', { email });
        if (!res.token) {
          toast('해당 이메일로 가입된 이메일 계정을 찾을 수 없습니다.', 'error');
          if (btn) { btn.disabled = false; btn.textContent = '코드 발송'; }
          return;
        }
        closeModal();
        showResetPassword(email, res.token);
      } catch (e) {
        toast(e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = '코드 발송'; }
      }
    }

    function showResetPassword(email, token) {
      showModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">🔐 새 비밀번호 설정</div>
    <div class="verify-sent-wrap" style="text-align:left;padding:0 0 8px">
      <p style="font-size:.83rem;color:var(--text2);margin-bottom:14px;line-height:1.6">
        <strong style="color:var(--accent)">${esc(email)}</strong>로 발송된<br>6자리 인증 코드를 입력해주세요.
      </p>
    </div>
    <div class="form-group">
      <label class="form-label">인증 코드</label>
      <input type="text" class="form-input" id="rp-code" placeholder="6자리 코드"
        maxlength="6" inputmode="numeric" style="text-align:center;font-size:1.3rem;letter-spacing:8px;font-weight:700"/>
    </div>
    <div class="form-group">
      <label class="form-label">새 비밀번호 <small style="color:var(--text3)">(영문+숫자 8자 이상)</small></label>
      <input type="password" class="form-input" id="rp-pw" placeholder="새 비밀번호 입력"
        onkeydown="if(event.key==='Enter')submitResetPassword('${token}')"/>
    </div>
    <div class="form-group">
      <label class="form-label">비밀번호 확인</label>
      <input type="password" class="form-input" id="rp-pw2" placeholder="비밀번호 재입력"
        onkeydown="if(event.key==='Enter')submitResetPassword('${token}')"/>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn primary" id="rp-btn" onclick="submitResetPassword('${token}')">비밀번호 변경</button>
    </div>
  `);
      setTimeout(() => document.getElementById('rp-code')?.focus(), 100);
    }

    async function submitResetPassword(token) {
      const code = document.getElementById('rp-code')?.value?.trim();
      const pw = document.getElementById('rp-pw')?.value;
      const pw2 = document.getElementById('rp-pw2')?.value;
      if (!code || code.length !== 6) { toast('6자리 코드를 입력해주세요.', 'error'); return; }
      if (!pw || pw.length < 8) { toast('비밀번호는 8자 이상이어야 합니다.', 'error'); return; }
      if (!/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) { toast('비밀번호는 영문과 숫자를 포함해야 합니다.', 'error'); return; }
      if (pw !== pw2) { toast('비밀번호가 일치하지 않습니다.', 'error'); return; }
      const btn = document.getElementById('rp-btn');
      if (btn) { btn.disabled = true; btn.textContent = '변경 중...'; }
      try {
        const res = await apiFetch('POST', '/auth/reset-password', { token, code, newPassword: pw });
        toast(res.message, 'success');
        closeModal();
        renderPage('auth');
      } catch (e) {
        toast(e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = '비밀번호 변경'; }
      }
    }

      const wrap = document.getElementById('grades-panel-wrap');

      const gc = p => p >= 80 ? 'var(--accent3)' : p >= 50 ? 'var(--accent)' : 'var(--accent2)';
      if (!S.history.length) {
        wrap.innerHTML = `<div class="grades-inline-panel"><div style="text-align:center;padding:28px;color:var(--text3);font-size:.875rem">아직 응시 기록이 없어요!</div></div>`;
        return;
      }
      const rows = [...S.history].reverse().slice(0, 10).map(r => {
        const p = r.percentage; const g = gc(p);
        const d = new Date(r.createdAt).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
        return `<tr>
      <td>${esc(r.testTitle || '—')}</td>
      <td>${d}</td>
      <td><div class="score-bar-row"><div class="score-bar"><div class="score-bar-fill" style="width:${p}%"></div></div><span style="font-family:'Syne',sans-serif;font-weight:800;font-size:.88rem;min-width:36px;text-align:right;color:${g}">${p}%</span></div></td>
      <td style="color:var(--accent3);font-weight:600">${r.correctAnswers}</td>
      <td style="color:var(--accent2);font-weight:600">${r.wrongAnswers}</td>
    </tr>`;
      }).join('');
      wrap.innerHTML = `<div class="grades-inline-panel">
    <div class="grades-panel-hdr">
      <span>${ic('chart')} 내 성적 기록</span>
      <button class="btn ghost sm" onclick="toggleGrades()">닫기</button>
    </div>
    <div style="overflow-x:auto">
      <table class="grades-table">
        <thead><tr><th>테스트</th><th>날짜</th><th>점수</th><th>정답</th><th>오답</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
    }

    function testCard(t) {
      const isOwner = (t.author?._id || t.author) === S.user?.id;
      const isFav = S.favoriteIds?.has(t._id) || false;
      const vis = t.isFriendOnly
        ? `<span class="tc-visibility friend">${ic('people',13)} 친구 공개</span>`
        : t.isPublic
          ? `<span class="tc-visibility public">${ic('globe',13)} 전체 공개</span>`
          : `<span class="tc-visibility private">${ic('lock',13)} 비공개</span>`;
      const fmtBadge = t.format === 'essay'
        ? `<span class="tc-badge" style="color:var(--accent3)">${ic('pencilDoc',13)} 주관식/서술형</span>`
        : t.format === 'cell'
          ? `<span class="tc-badge" style="color:var(--accent4)">${ic('bolt',13)} 셀 방식</span>`
          : `<span class="tc-badge">${ic('clipboard',13)} 섹션 방식</span>`;
      return `<div class="test-card">
    <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:4px">
      <div class="tc-title" style="flex:1;margin-bottom:0">${esc(t.title)}</div>
      <button class="fav-btn ${isFav ? 'active' : ''}" id="fav-${t._id}"
        onclick="toggleFavorite('${t._id}',this)" title="${isFav ? '즐겨찾기 해제' : '즐겨찾기 추가'}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </button>
    </div>
    <div class="tc-desc">${esc(t.description || '설명이 없습니다.')}</div>
    <div class="tc-meta">
      <div class="tc-badges">
        <span class="tc-badge"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/></svg>${t.questions?.length ?? 0}문항</span>
        ${fmtBadge}${vis}
      </div>
    </div>
    <div class="tc-meta" style="margin-bottom:0"><span class="tc-author">by ${esc(t.author?.username || '알 수 없음')}</span></div>
    <div class="tc-actions" style="margin-top:12px">
      <button class="btn primary sm" onclick="openTestMethodPicker('${t._id}')">▶ 시험 보기</button>
      ${isOwner ? `<button class="btn ghost sm" onclick="editTest('${t._id}')">${ic('pencil',14)} 수정</button><button class="btn danger sm" onclick="deleteTest('${t._id}')">${ic('trash',14)}</button>` : ''}
    </div>
  </div>`;
    }

    function filterTests(q) {
      const lq = q.toLowerCase();
      const f = S.tests.filter(t => t.title.toLowerCase().includes(lq) || (t.description || '').toLowerCase().includes(lq));
      const g = document.getElementById('all-grid');
      if (g) g.innerHTML = f.length > 0 ? f.map(t => testCard(t)).join('') : '<div class="empty-state"><h3>검색 결과 없음</h3></div>';
    }

    /* ============================================================
       ALL TESTS PAGE — 전체 / 내 테스트 / 즐겨찾기 탭
    ============================================================ */
    let allTestsTab = 'all'; // 'all' | 'mine' | 'fav'
    let allTestsSort = 'newest'; // 'newest' | 'favorites' | 'popular'

    function buildAllTests(app, opts = {}) {
      allTestsTab = opts.tab || allTestsTab || 'all';

      app.innerHTML = topNav('tests') + `
  <div class="page active">
    <div class="scroll-body">
      <div class="section" style="padding-top:20px">

        <!-- 탭 -->
        <div class="tests-tab-row">
          <div id="atab-all"  class="tests-tab-btn ${allTestsTab === 'all' ? 'active' : ''}"  onclick="switchAllTestsTab('all')">${ic('globe',14)} 전체</div>
          <div id="atab-mine" class="tests-tab-btn ${allTestsTab === 'mine' ? 'active' : ''}" onclick="switchAllTestsTab('mine')">${ic('pencilDoc',14)} 내 테스트</div>
          <div id="atab-fav"  class="tests-tab-btn ${allTestsTab === 'fav' ? 'active' : ''}"  onclick="switchAllTestsTab('fav')">
            ${ic('star',14)} 즐겨찾기
            ${(S.favorites?.length) ? `<span class="tests-tab-badge">${S.favorites.length}</span>` : ''}
          </div>
        </div>

        <!-- 검색 + 정렬 -->
        <div style="display:flex;gap:8px;margin-bottom:14px;align-items:center">
          <div class="search-wrap" style="flex:1;margin-bottom:0">
            <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="search" inputmode="search" class="search-input" id="all-tests-search"
              placeholder="테스트 검색..." oninput="filterAllTests(this.value)"/>
          </div>
          <button class="btn ghost sm" id="tests-sort-btn" onclick="toggleTestsSort()" style="white-space:nowrap;flex-shrink:0;font-size:.72rem;padding:8px 10px">
            ${ic('arrowSort',13)} ${allTestsSort === 'favorites' ? '즐겨찾기순' : allTestsSort === 'popular' ? '인기순' : '최신순'}
          </button>
        </div>

        <!-- 테스트 목록 -->
        <div class="tests-grid" id="all-tests-grid">
          ${renderAllTestsGrid(allTestsTab, '')}
        </div>
      </div>
    </div>
  </div>` + bottomNav();
    }

    function switchAllTestsTab(tab) {
      allTestsTab = tab;
      ['all', 'mine', 'fav'].forEach(t => {
        document.getElementById('atab-' + t)?.classList.toggle('active', t === tab);
      });
      const q = document.getElementById('all-tests-search')?.value || '';
      const g = document.getElementById('all-tests-grid');
      if (g) g.innerHTML = renderAllTestsGrid(tab, q);
    }

    function toggleTestsSort() {
      const order = ['newest', 'favorites', 'popular'];
      allTestsSort = order[(order.indexOf(allTestsSort) + 1) % order.length];
      const btn = document.getElementById('tests-sort-btn');
      if (btn) btn.innerHTML = ic('arrowSort',13) + ' ' + (allTestsSort === 'favorites' ? '즐겨찾기순' : allTestsSort === 'popular' ? '인기순' : '최신순');
      const q = document.getElementById('all-tests-search')?.value || '';
      const g = document.getElementById('all-tests-grid');
      if (g) g.innerHTML = renderAllTestsGrid(allTestsTab, q);
    }

    function filterAllTests(q) {
      const g = document.getElementById('all-tests-grid');
      if (g) g.innerHTML = renderAllTestsGrid(allTestsTab, q);
    }

    function renderAllTestsGrid(tab, q) {
      const lq = q.toLowerCase();
      let src;
      if (tab === 'mine') src = S.myTests;
      else if (tab === 'fav') src = S.favorites || [];
      else src = S.tests;

      let filtered = lq
        ? src.filter(t => t.title.toLowerCase().includes(lq) || (t.description || '').toLowerCase().includes(lq))
        : [...src];

      if (allTestsSort === 'favorites') filtered.sort((a, b) => (b.favoriteCount || 0) - (a.favoriteCount || 0));
      else if (allTestsSort === 'popular') filtered.sort((a, b) => (b.playCount || 0) - (a.playCount || 0));

      if (!filtered.length) {
        if (tab === 'mine') return '<div class="empty-state"><h3>만든 테스트가 없어요</h3><p>첫 번째 테스트를 만들어보세요!</p></div>';
        if (tab === 'fav') return `<div class="fav-empty"><span class="fav-empty-icon">${ic('star',40)}</span><div class="fav-empty-title">즐겨찾기한 테스트가 없어요</div><div class="fav-empty-desc">테스트 카드의 ☆ 버튼을 눌러<br>자주 보는 테스트를 저장해보세요!</div></div>`;
        return '<div class="empty-state"><h3>검색 결과가 없어요</h3></div>';
      }
      return filtered.map(t => testCard(t)).join('');
    }

    /* ── 즐겨찾기 토글 ── */
    async function toggleFavorite(testId, btn) {
      if (!S.user) { toast('로그인이 필요합니다.', 'error'); return; }
      const isFav = S.favoriteIds?.has(testId);
      // 낙관적 UI 업데이트
      btn.classList.toggle('active', !isFav);
      const svgPoly = btn.querySelector('polygon');
      if (svgPoly) svgPoly.setAttribute('fill', !isFav ? 'currentColor' : 'none');
      btn.title = !isFav ? '즐겨찾기 해제' : '즐겨찾기 추가';

      try {
        if (isFav) {
          await apiFetch('DELETE', `/favorites/${testId}`);
          S.favoriteIds?.delete(testId);
          S.favorites = (S.favorites || []).filter(t => (t._id || t) !== testId);
          toast('즐겨찾기에서 제거했습니다', 'info');
        } else {
          await apiFetch('POST', `/favorites/${testId}`);
          S.favoriteIds?.add(testId);
          // 전체 목록에서 찾아 favorites에 추가 (재조회 없이)
          const full = S.tests.find(t => t._id === testId) || S.myTests.find(t => t._id === testId);
          if (full && !S.favorites.some(t => (t._id || t) === testId)) S.favorites.push(full);
          toast('⭐ 즐겨찾기에 추가했습니다', 'success');
        }
        // 즐겨찾기 탭 배지 업데이트
        const badge = document.querySelector('#atab-fav .tests-tab-badge');
        const cnt = S.favorites?.length || 0;
        if (badge) { badge.textContent = cnt; badge.style.display = cnt ? '' : 'none'; }
        else if (cnt) {
          const tab = document.getElementById('atab-fav');
          if (tab && !tab.querySelector('.tests-tab-badge')) {
            tab.insertAdjacentHTML('beforeend', `<span class="tests-tab-badge">${cnt}</span>`);
          }
        }
        // 즐겨찾기 탭이 열려있으면 목록 갱신
        if (allTestsTab === 'fav') {
          const g = document.getElementById('all-tests-grid');
          if (g) g.innerHTML = renderAllTestsGrid('fav', document.getElementById('all-tests-search')?.value || '');
        }
      } catch (e) {
        // 실패시 롤백
        btn.classList.toggle('active', isFav);
        if (svgPoly) svgPoly.setAttribute('fill', isFav ? 'currentColor' : 'none');
        btn.title = isFav ? '즐겨찾기 해제' : '즐겨찾기 추가';
        toast(e.message, 'error');
      }
    }

    /* 홈 화면 즐겨찾기 섹션 렌더 헬퍼 */
    function buildFavSection() {
      const favs = S.favorites || [];
      if (!favs.length) return '';
      return `
  <div class="section">
    <div class="sec-header">
      <span class="sec-title">${ic('star')} 즐겨찾기</span>
      ${favs.length > 3 ? `<button class="btn ghost sm" onclick="renderPage('tests',{tab:'fav'})">더보기 →</button>` : ''}
    </div>
    <div class="tests-grid">${favs.slice(0, 3).map(t => testCard(t)).join('')}</div>
  </div>`;
    }

    async function deleteTest(id) {
      if (!confirm('테스트를 삭제하시겠어요?')) return;
      try { await apiFetch('DELETE', `/tests/${id}`); toast('삭제되었습니다.', 'success'); await loadData(); renderPage('home'); }
      catch (e) { toast(e.message, 'error'); }
    }
    async function editTest(id) {
      try {
        const t = await apiFetch('GET', `/tests/${id}`);
        S.editing = id;
        S.editorTest = { title: t.title, description: t.description, questions: t.questions, isPublic: t.isPublic, isFriendOnly: t.isFriendOnly || false, tags: t.tags || [], format: t.format || 'section' };
        S.editorFormat = t.format || 'section';
        renderPage('editor');
      } catch (e) { toast(e.message, 'error'); }
    }

    /* ============================================================
       TEST METHOD PICKER (개선된 UI — 기존 fmt-card 스타일 활용)
    ============================================================ */
    async function openTestMethodPicker(testId) {
      S.pendingTestId = testId;
      S.selectedMethod = null;
      const meta = S.tests.find(t => t._id === testId) || S.myTests.find(t => t._id === testId);

      showModal(`<div class="modal-handle"></div><div class="modal-title">🎯 시험 방식 선택</div><div style="text-align:center;padding:24px 0;color:var(--text3);font-size:.85rem">문항 정보를 불러오는 중...</div>`);

      let qCount = 1;
      try {
        const fullTest = await apiFetch('GET', `/tests/${testId}`);
        qCount = fullTest.questions?.length || 1;
      } catch (e) {
        qCount = 1;
      }
      S.pendingQCount = qCount;

      closeModal();
      showModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">🎯 시험 방식 선택</div>
    <p style="text-align:center;font-size:.82rem;color:var(--text2);margin-bottom:20px">${esc(meta?.title || '')} · ${qCount}문항</p>
    <div class="format-picker" style="grid-template-columns:1fr 1fr">
      <div class="fmt-card" onclick="pickMethod(this,'shuffle')" data-m="shuffle">
        <div class="fmt-check">✓</div>
        <div class="fmt-icon">${ic('shuffle',28)}</div>
        <div class="fmt-name">랜덤 순서</div>
        <div class="fmt-desc">문항을 무작위로 섞어서 출제</div>
      </div>
      <div class="fmt-card" onclick="pickMethod(this,'order')" data-m="order">
        <div class="fmt-check">✓</div>
        <div class="fmt-icon">${ic('clipboard',28)}</div>
        <div class="fmt-name">순서대로</div>
        <div class="fmt-desc">원래 순서대로 출제</div>
      </div>
    </div>
    <div class="test-count-row">
      <label>문제 수</label>
      <input type="number" class="count-input" id="tc-count" value="${qCount}" min="1" max="${qCount}">
      <span style="font-size:.82rem;color:var(--text3)">/ ${qCount}문항</span>
    </div>
    ${qCount >= 5 && meta?.format !== 'essay' ? `
    <div style="background:rgba(var(--accent-rgb),.06);border:1px solid rgba(var(--accent-rgb),.2);border-radius:12px;padding:12px 14px;margin-bottom:4px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:.85rem;font-weight:600;color:var(--text)">${ic('pencil',14)} 주관식 문항 포함</span>
        <div class="toggle ${S.includeSubjective ? 'on' : ''}" id="subj-toggle" onclick="toggleSubjective()"></div>
      </div>
      <div id="subj-count-row" style="display:${S.includeSubjective ? 'flex' : 'none'};align-items:center;gap:8px;margin-bottom:6px">
        <label style="font-size:.78rem;color:var(--text2);white-space:nowrap">주관식 문항 수</label>
        <input type="number" class="count-input" id="subj-count" value="${Math.max(1, Math.round(qCount * 0.1))}" min="1" max="${qCount}" style="width:60px;text-align:center">
        <span style="font-size:.75rem;color:var(--text3)">/ ${qCount}문항</span>
      </div>
      <div style="font-size:.75rem;color:var(--text3);line-height:1.5">선택한 문항 수만큼 주관식(직접 입력)으로 출제합니다.<br>주관식 문항은 타이머 없이 진행됩니다.</div>
    </div>`: ''}
    ${meta?.format === 'essay' ? `
    <div style="background:rgba(var(--accent-rgb),.06);border:1px solid rgba(var(--accent-rgb),.2);border-radius:12px;padding:12px 14px;margin-bottom:4px">
      <div style="font-size:.85rem;font-weight:600;color:var(--accent);margin-bottom:4px">${ic('pencilDoc',14)} 주관식/서술형 테스트</div>
      <div style="font-size:.75rem;color:var(--text3);line-height:1.5">모든 문항이 주관식으로 출제됩니다. 키워드 기반으로 자동 채점됩니다.</div>
    </div>`: ''}
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="confirmTestMethod()">시작하기 →</button>
    </div>
  `);
    }

    function pickMethod(el, method) {
      document.querySelectorAll('.fmt-card[data-m]').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      S.selectedMethod = method;
    }

    async function confirmTestMethod() {
      if (!S.selectedMethod) { toast('방식을 선택해주세요', 'error'); return; }
      const countEl = document.getElementById('tc-count');
      const count = parseInt(countEl?.value) || S.pendingQCount || 9999;
      const subjEl = document.getElementById('subj-count');
      S._subjCount = subjEl ? parseInt(subjEl.value) || 1 : null;
      closeModal();
      await startTest(S.pendingTestId, S.selectedMethod, count);
    }

       EDITOR ENTRY — format picker

      S.editorTest = { title: '', description: '', questions: [], isPublic: true, isFriendOnly: false, tags: [], format: 'section' };
      S.editorFormat = null;
      renderPage('editor');
    }
